<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Import Old Files</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E6B5A">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F5F3;--surface:#FFFFFF;--surface-2:#E8EEEB;--line:#D3DCD8;--ink:#13201C;--muted:#5A6A65;--accent:#0E6B5A;--accent-2:#0A5143;--on-accent:#FFFFFF;
  --ok:#2C7A3A;--ok-bg:#E3F1E5;--warn:#A8670B;--warn-bg:#FBEFD9;--crit:#B3261E;--crit-bg:#FBE4E1;--info:#1F5B8E;--info-bg:#E2ECF6;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;--f-body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1412;--surface:#151D1A;--surface-2:#1C2622;--line:#2A3631;--ink:#E3EBE7;--muted:#93A39D;--accent:#4CB89D;--accent-2:#6FCDB5;--on-accent:#08201A;
  --ok:#6CC27A;--ok-bg:#16301C;--warn:#E3AA4F;--warn-bg:#33270F;--crit:#F2766B;--crit-bg:#3A1714;--info:#7FB2E0;--info-bg:#132637;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412;--surface:#151D1A;--surface-2:#1C2622;--line:#2A3631;--ink:#E3EBE7;--muted:#93A39D;--accent:#4CB89D;--accent-2:#6FCDB5;--on-accent:#08201A;
  --ok:#6CC27A;--ok-bg:#16301C;--warn:#E3AA4F;--warn-bg:#33270F;--crit:#F2766B;--crit-bg:#3A1714;--info:#7FB2E0;--info-bg:#132637;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px}
.top h1{font:800 16px/1.1 var(--f-display);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font:500 11px var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
main{max-width:1040px;margin:0 auto;padding:20px 16px 80px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
h2{font:800 22px/1.15 var(--f-display);margin:0 0 4px}
h3{font:700 15px/1.2 var(--f-display);margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2)}
.btn.ok{border-color:color-mix(in srgb,var(--ok) 50%,var(--line));color:var(--ok)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;min-height:34px;max-width:100%}
.inp:focus{border-color:var(--accent);outline:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 180px;min-width:0}
.field>label{font-size:12px;font-weight:600;color:var(--muted)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font:600 12px var(--f-body);padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--on-accent)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;font-size:12.5px;width:100%}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
th{font-weight:600;color:var(--muted);background:var(--surface-2)}
tr.hdr td{background:var(--info-bg);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.stat{padding:12px 14px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font:800 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.need b{color:var(--crit)}.stat.ready b{color:var(--ok)}.stat.warn b{color:var(--warn)}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{border-left:0;border-top:1px solid var(--line)}.stat:nth-child(-n+2){border-top:0}.stat:nth-child(even){border-left:1px solid var(--line)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.group{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.group-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.group-h b{font:700 14px var(--f-display)}
.group-h .sp{flex:1}
.iss{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.iss:last-child{border-bottom:0}
.iss .where{font-size:12px;color:var(--muted)}
.iss .where .mono{color:var(--ink)}
.iss .msg{font-weight:600}
.iss .msg.crit{color:var(--crit)}.iss .msg.warn{color:var(--warn)}.iss .msg.info{color:var(--info)}
.iss .sugg{background:var(--info-bg);color:var(--info);border-radius:8px;padding:6px 10px;font-weight:600;align-self:flex-start}
.iss .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.iss.done{background:color-mix(in srgb,var(--ok) 5%,var(--surface))}
.iss .state{font:600 12px var(--f-body);color:var(--ok)}
.iss .state.skip{color:var(--muted)}
.pill{display:inline-block;font:600 11px/1 var(--f-body);padding:4px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.dc{background:var(--info-bg);color:var(--info)}.pill.mt{background:var(--ok-bg);color:var(--ok)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.bar-bottom{position:sticky;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;box-shadow:0 -6px 18px rgba(0,0,0,.06)}
.bar-bottom .msg{flex:1;min-width:200px;font-weight:600}
.note{border-radius:10px;padding:10px 12px;background:var(--warn-bg);color:var(--warn);font-weight:500}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.crit{background:var(--crit-bg);color:var(--crit)}
.note.info{background:var(--info-bg);color:var(--info)}
.list{display:flex;flex-direction:column;gap:8px}
.past{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.past .sp{flex:1;min-width:160px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;z-index:50;font-weight:600;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<header class="top">
  <a class="btn sm" href="./" id="back">← <span data-t>Back to app</span></a>
  <h1><span data-t>Import old files</span><small id="who"></small></h1>
  <span class="muted small mono" id="ver"></span>
  <button class="btn sm" id="lang"></button>
</header>
<main id="main"><div class="panel muted"><span class="spin"></span> <span data-t>Loading…</span></div></main>
<div id="bottom"></div>
<datalist id="dl-cust"></datalist>
<datalist id="dl-cyl"></datalist>

<script>
(function(){

/* ================= helpers ================= */

 'Choose file':'File தேர்வு','Match columns':'Column பொருத்தம்','Check & decide':'சரிபார்த்து முடிவு','Import':'இறக்குமதி',

const FB=window.FBC._raw;const fs=FB.fs;
const S={me:null,company:{branches:['DPI','KGIRI'],branchNames:{DPI:'Dharmapuri',KGIRI:'Krishnagiri'}},
  cylMaster:new Map(),known:new Set(),gases:[],custs:[],custBySlug:new Map(),custIdx:[],
  exSeq:new Map(),exKeys:new Map(),logFirst:new Map(),
  step:'file',file:null,wb:null,sheet:null,grid:[],hdr:0,map:{},RAW:[],D:{},A:null,tab:'need',page:0,past:[],busy:false,result:null};

async function loadAll(){
  const [metaS,histQ,cylQ,custS,logQ,coS]=await Promise.all([
    fs.doc('hist/meta').get(),fs.collection('hist').get(),fs.collection('cyl').get(),fs.doc('cust/all').get(),fs.collection('log').get(),fs.doc('settings/company').get()]);
  if(coS.exists)Object.assign(S.company,coS.data());
  S.cylMaster.clear();S.known.clear();
  cylQ.docs.forEach(d=>{const l=(d.data()||{}).list||{};for(const k in l){S.cylMaster.set(k,l[k]);S.known.add(k)}});
  const meta=metaS.exists?FB.dec(metaS.data()):{cyl:[],cust:[]};
  (meta.cyl||[]).forEach(c=>S.known.add(c));
  S.gases=[...new Set([...S.cylMaster.values()].map(c=>c.g).filter(Boolean))].sort();
  if(!S.gases.length)S.gases=['O2','CO2','N2','Argon','DURO'];
  // customers: master list + names used in old history
  const list=custS.exists?(custS.data().list||{}):{};S.custBySlug.clear();
  for(const k in list){const n=list[k]&&list[k].n;if(n)S.custBySlug.set(slug(n),n)}
  (meta.cust||[]).forEach(n=>{if(n&&!S.custBySlug.has(slug(n)))S.custBySlug.set(slug(n),n)});
  S.custs=[...S.custBySlug.values()].sort((a,b)=>a.localeCompare(b));
  S.custIdx=S.custs.map(n=>({n,k:ckey(n),toks:ntoks(n)}));
  // existing history, in stored order
  const chunks=[];histQ.docs.forEach(d=>{const v=FB.dec(d.data());if(d.id!=='meta'&&Array.isArray(v.ev))chunks[v.i]=v.ev});
  S.exSeq.clear();S.exKeys.clear();S.logFirst.clear();
  const T=['DC','MT'];
  for(const ch of chunks.filter(Boolean))for(const e of ch){
    const id=meta.cyl[e[0]];const cn=e[3]>=0?meta.cust[e[3]]:'';
    if(!S.exSeq.has(id))S.exSeq.set(id,{hist:[],log:[]});
    S.exSeq.get(id).hist.push({day:e[2],t:T[e[1]],cn});
    if(e[2]>=0)S.exKeys.set(id+'|'+T[e[1]]+'|'+e[2],'old');
  }
  logQ.docs.forEach(d=>{const recs=(d.data()||{}).recs||{};for(const r of Object.values(recs)){
    if(!r||r.del||!Array.isArray(r.cy)||!r.d)continue;const day=dayFromIso(r.d);
    r.cy.forEach(id=>{if(!S.exSeq.has(id))S.exSeq.set(id,{hist:[],log:[]});S.exSeq.get(id).log.push({day,t:r.t,cn:r.cn||''});
      S.exKeys.set(id+'|'+r.t+'|'+day,'app');if(!S.logFirst.has(id)||day<S.logFirst.get(id))S.logFirst.set(id,day)})}});
  for(const v of S.exSeq.values())v.log.sort((a,b)=>a.day-b.day);
  $('#dl-cust').innerHTML=S.custs.map(n=>`<option value="${esc(n)}">`).join('');
  $('#dl-cyl').innerHTML=[...S.known].sort().map(n=>`<option value="${esc(n)}">`).join('');
}
async function loadPast(){
  try{const q=await fs.collection('reg').get();
    S.past=q.docs.filter(d=>d.id.startsWith('imp_')).map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  }catch(e){S.past=[]}
}

const ABBR={hospital:'hos',hospitals:'hos',hosp:'hos',engineering:'eng',engineers:'eng',engg:'eng',engineer:'eng',industries:'ind',industry:'ind',inds:'ind',
  traders:'trd',trader:'trd',enterprises:'ent',enterprise:'ent',clinic:'cli',nursing:'nur',home:'home',company:'co',corporation:'corp',limited:'ltd',private:'pvt'};
const STOP=new Set(['m','s','ms','the','and','sri','shri','sree','mr','mrs']);
function ntoks(s){return String(s||'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean).map(w=>ABBR[w]||w).filter(w=>!STOP.has(w))}
const ckey=s=>ntoks(s).join('');
function lev(a,b){if(a===b)return 0;const n=a.length,mm=b.length;if(!n)return mm;if(!mm)return n;let p=Array.from({length:mm+1},(_,i)=>i);
  for(let i=1;i<=n;i++){const c=[i];for(let j=1;j<=mm;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[mm]}
const matchCache=new Map();
function bestCust(raw){
  if(matchCache.has(raw))return matchCache.get(raw);
  const k=ckey(raw),tk=ntoks(raw);let best=null,score=0;
  if(k)for(const c of S.custIdx){
    let s=c.k===k?0.99:1-lev(k,c.k)/Math.max(k.length,c.k.length);
    if(tk.length&&c.toks.length){const pre=tk.every(a=>c.toks.some(b=>b.startsWith(a)||a.startsWith(b)))&&c.toks.every(b=>tk.some(a=>b.startsWith(a)||a.startsWith(b)));if(pre)s=Math.max(s,0.92)}

/* ================= parsing ================= */
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
const TY=now.getFullYear();
const MIN_DAY=dayNum(2015,1,1);
const okDay=d=>d!=null&&d>=MIN_DAY&&d<=TODAY;
function mkDate(y,mo,d){if(y<100)y+=2000;if(mo<1||mo>12||d<1||d>31||y<1900||y>9999)return null;const day=dayNum(y,mo,d);if(isoFromDay(day)!==String(y).padStart(4,'0')+'-'+pad(mo)+'-'+pad(d))return null;

function parseDate(v){
  if(blank(v))return null;

  if((x=/^(\d{1,2})[\/\-.\s]*([A-Za-z]{3,9})[\/\-.\s,']*(\d{2,4})$/.exec(s))){const mo=MON[x[2].toLowerCase()]||MON[x[2].toLowerCase().slice(0,3)];return mo?mkDate(+x[3],mo,+x[1]):null}

/* Possible intended dates for a mistyped one (06-626 → 06-06-2026, 2027 → 2026 …), with a cost:
   0 = uses every digit as typed, 1 = one digit dropped or day/month swapped. */
function dateCands(v){
  const out=new Map();
  const add=(y,mo,d,cost)=>{if(y<100)y+=2000;const p=mkDate(y,mo,d);if(p&&okDay(p.day)&&!(out.get(p.day)<=cost))out.set(p.day,cost)};
  if(typeof v==='number'){const p=parseDate(v);if(p){const iso=isoFromDay(p.day);const mo=+iso.slice(5,7),d=+iso.slice(8,10);for(let y=2015;y<=TY;y++){add(y,mo,d,0);add(y,d,mo,1)}}return out}
  const s=String(v??'').trim();if(!s)return out;
  const tri=(a,b,c,cost)=>{if(!a||!b||!c||a.length>2||b.length>2||(c.length!==2&&c.length!==4))return;add(+c,+b,+a,cost)};
  const vars=[[s,0]];for(let i=0;i<s.length;i++)if(/\d/.test(s[i]))vars.push([s.slice(0,i)+s.slice(i+1),1]);
  for(const [x,cost] of vars){const g=x.split(/[^0-9]+/).filter(Boolean);
    if(g.length===3)tri(...g,cost);
    else if(g.length===2){for(let i=0;i<2;i++){const p=g[i];for(let k=1;k<p.length;k++){const q=[...g];q.splice(i,1,p.slice(0,k),p.slice(k));tri(...q,cost)}}}
    else if(g.length===1){const p=g[0];for(let i=1;i<p.length;i++)for(let j=i+1;j<p.length;j++)tri(p.slice(0,i),p.slice(i,j),p.slice(j),cost)}}

  return out;
}
function bestDate(v,prev,next){
  const c=dateCands(v);if(!c.size)return null;
  const ref=prev??next;
  const all=[...c.keys()];
  if(ref==null){const z=all.filter(d=>c.get(d)===0);return z.length===1?z[0]:all.length===1?all[0]:null}
  const lo=prev??-Infinity,hi=next??TODAY;
  let pool=all.filter(d=>d>=lo&&d<=hi);
  if(!pool.length)pool=all.filter(d=>Math.abs(d-ref)<=120);
  if(!pool.length)return null;
  pool.sort((a,b)=>c.get(a)-c.get(b)||Math.abs(a-ref)-Math.abs(b-ref));return pool[0];
}
function parseType(v){const s=String(v||'').trim().toUpperCase();if(!s)return null;
  if(/^(DC|D|OUT|DELIVERY|DELIVERED|DEL|ISSUE|ISSUED|SENT|SEND|FULL|DISPATCH)\b/.test(s))return 'DC';

  return 'bad'}
/* Split a cylinder cell. Spacing, capital letters and a dash between a letter prefix and the number

function splitCyl(v){

  s.split(/[,;\/&+\n\r]+|\s{2,}|\s+(?=\d)(?<=\d\s+)/).forEach(part=>{
    let p=part.trim();if(!p)return;

    p.split(/\s+/).length>1&&cleaned===p?p.split(/\s+/).forEach(q=>toks.push({raw:q,id:normCyl(q)})):toks.push({raw:p,id:normCyl(cleaned)});
  });

}
function rangeOf(id){const x=/^([A-Z]*)(\d+)-([A-Z]*)(\d+)$/.exec(id);if(!x)return null;
  if(x[3]&&x[3]!==x[1])return null;const a=+x[2],b=+x[4];if(!(b>a&&b-a<=30&&x[2].length===x[4].length))return null;
  const ids=[];for(let i=a;i<=b;i++)ids.push(x[1]+String(i).padStart(x[2].length,'0'));return {ids,a:x[1]+x[2],b:x[1]+x[4]}}

  const c=[];let x;

  if(/O/.test(id)){const y=id.replace(/(?<=\d|^)O|O(?=\d)/g,'0');if(y!==id)c.push(y)}
  if((x=/^([A-Z]*)(\d+)[A-Z.]+$/.exec(id)))c.push(x[1]+x[2]);
  if((x=/^([A-Z]+)-?0*(\d+)$/.exec(id)))c.push(x[1]+x[2]);
  return c.find(k=>k!==id&&S.known.has(k))||null}
const colName=i=>{let s='';i++;while(i>0){const r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=Math.floor((i-1)/26)}return s};
const cellTxt=v=>{if(typeof v==='number'&&Number.isInteger(v)&&v>1&&v<3e6){return fmtDay(v-25569)}return String(v??'')};

function guessHeader(g){for(let r=0;r<Math.min(g.length,15);r++){const row=g[r]||[];const txt=row.filter(c=>typeof c==='string'&&c.trim()&&isNaN(+c)).length;if(txt>=2)return r}return 0}

  const map={date:find(/date|dt\b|தேதி|^day/),cyl:find(/cyl|சிலிண்டர்|sl\.?\s*no|^no\.?s?$|number/),cust:find(/cust|party|name|வாடிக்கை|client|hospital/),type:find(/^type|dc\s*\/\s*mt|in\s*\/\s*out|status|வகை|^dc\/mt|^mt\/dc/),ref:find(/dc\s*no|mt\s*no|bill|challan|ref/)};

function buildRaw(){

/* ---------- register layout: one row per cylinder, DC Date | DC Name | MT Date | MT Name … ---------- */
function findRegister(g){
  for(let r=0;r<Math.min(g.length,12);r++){const row=(g[r]||[]).map(c=>String(c??'').trim().toLowerCase());
    const dc=[];row.forEach((c,i)=>{if(/^dc\s*date$/.test(c))dc.push(i)});const mt=row.filter(c=>/^mt\s*date$/.test(c)).length;
    if(dc.length>=2&&mt>=1){const st=dc[0];return {hdr:r,num:0,label:st>=2?1:'',start:st}}}

const SECTION=/^(dharmapuri|dpi|krishnagiri|kgiri|o2|n2|co2|argon|duro|missing.*|sold.*)$/i;
function buildReg(){
  const g=S.grid,R=S.reg;const out=[];let sec='';
  for(let r=S.hdr+1;r<g.length;r++){const row=g[r]||[];const a=row[R.num];if(blank(a))continue;
    const as=String(a).trim();
    const evs=[];
    for(let c=R.start;c<row.length;c+=2){const date=row[c],name=row[c+1];const tt=((c-R.start)/2)%2===0?'DC':'MT';
      const ds=String(date??'').trim(),ns=String(name??'').trim();
      if(ds==='*'||(!ds&&(!ns||ns==='*')))continue;
      evs.push({col:c,t:tt,date:ds?date:'',name:ns==='*'?'':ns})}
    if((SECTION.test(as)||!/\d/.test(as))&&!evs.length){sec=as.toUpperCase();continue}
    const m_=/^([A-Za-z]*)\s*(\d+)/.exec(as);if(!m_)continue;
    out.push({r:r+1,num:m_[2],pre:m_[1].toUpperCase(),raw:as,label:R.label===''?'':String(row[R.label]??'').trim(),sec,evs});
  }
  S.REG=out;
}
const fam=g=>/^CO2/.test(g||'')?'CO2':(g||'');
function regGas(x){
  const co2=s=>/40/.test(s)?'CO2 40kg':/30/.test(s)?'CO2 30kg':(S.gases.find(g=>/^CO2/.test(g))||'CO2');
  const pick=s=>/DURO/.test(s)?'DURO':/ARGON/.test(s)?'Argon':/(^|[^A-Z0-9])N2([^A-Z0-9]|$)/.test(s)?'N2':/CO2/.test(s)?co2(s):null;
  return (x.pre==='D'?'DURO':null)||pick(x.label.toUpperCase())||pick(x.sec)||'O2'}
function regBr(x,g){const L=x.label.toUpperCase();
  if(/KGIRI|KRISHNAGIRI/.test(L))return 'KGIRI';if(/^DPI$|DHARMAPURI/.test(L))return 'DPI';
  if(g==='O2')return /KRISHNAGIRI|KGIRI/.test(x.sec)?'KGIRI':'DPI';return ''}
function resolveReg(){
  const byNum=new Map();for(const id of S.known){const m_=/^([A-Z]*)(\d+)(-\d+)?$/.exec(id);if(!m_)continue;if(!byNum.has(m_[2]))byNum.set(m_[2],[]);byNum.get(m_[2]).push(id)}
  for(const v of byNum.values())v.sort();
  const used=new Set();S.hints={};
  const PRE={O2:'',Argon:'A',N2:'N',DURO:'D',CO2:'C'};
  const fits=(id,g,b)=>{const i=S.cylMaster.get(id);if(!i||!i.g)return true;if(fam(i.g)!==fam(g))return false;return g!=='O2'||!i.b||i.b===b};
  for(const x of S.REG){
    const g=regGas(x),b=regBr(x,g);x.g=g;x.b=b;x.id=null;x.newId=null;
    const c=(byNum.get(x.num)||[]).filter(id=>!used.has(id));
    const parsed=x.evs.map(e=>parseDate(e.date)).filter(Boolean).length;
    // 1) the cylinder whose old history matches this row (the app's history came from this sheet)
    let best=null,bs=0;
    for(const id of c){const h=(S.exSeq.get(id)||{hist:[]}).hist;const hk=new Map();h.forEach(e=>{const k=e.t+'|'+e.day;hk.set(k,(hk.get(k)||0)+1)});let s=0;
      for(const e of x.evs){const p=parseDate(e.date);if(!p)continue;const k=e.t+'|'+p.day;if(hk.get(k)>0){hk.set(k,hk.get(k)-1);s++}}
      if(s>bs||(s===bs&&s>0&&fits(id,g,b)&&!fits(best,g,b))){bs=s;best=id}}

    let id=(x.pre&&fam(g)!=='O2'?x.pre:(PRE[fam(g)]??''))+x.num;
    if(g==='O2'&&b==='KGIRI'&&(S.known.has(id)||used.has(id)))id='K'+x.num;
    let k=2;const base=id;while(S.known.has(id)||used.has(id))id=base+'-'+(k++);

/* Movements of each register row that are not yet in the app. The app's old history was built from this
   same sheet in column order, so the matching start of each row is skipped; only what follows is checked. */
function regItems(){
  const items=[];let inApp=0;const differs=[];
  for(const x of S.REG){
    const id=x.id||x.newId;
    const H=x.id?((S.exSeq.get(x.id)||{hist:[]}).hist):[];
    let p=0;
    while(p<x.evs.length&&p<H.length){const e=x.evs[p],h=H[p];const d=parseDate(e.date);
      if(e.t===h.t&&(!d||!okDay(d.day)||h.day<0||d.day===h.day))p++;else break}
    const rep=S.regMode==='replace';const known=p;
    if(rep)p=0;else{inApp+=p;if(p<H.length&&p<x.evs.length)differs.push(x.r)}
    const days=x.evs.map(e=>{const d=parseDate(e.date);return d&&okDay(d.day)?d.day:null});
    for(let i=p;i<x.evs.length;i++){const e=x.evs[i];let prev=null,next=null;
      for(let j=i-1;j>=0;j--)if(days[j]!=null){prev=days[j];break}
      for(let j=i+1;j<days.length;j++)if(days[j]!=null){next=days[j];break}
      const was=i<known?H[i]:null;
      items.push({r:x.r+':'+colName(e.col),label:t('Row')+' '+x.r+' · '+colName(e.col),date:e.date,type:e.t,cust:e.name,ids:[id],prev,next,appDay:was&&was.day>=0?was.day:null,appCn:was?was.cn:null,appNoDate:!!(was&&was.day<0),
        line:[x.raw+(x.label?' ('+x.label+')':''),e.t,cellTxt(e.date),e.name]})}

/* ================= analysis ================= */
function analyze(){
  const D=S.D;const issues=new Map();const rowsOut=[];const cleaned=[];
  const addIss=(key,o,r)=>{let i=issues.get(key);if(!i){i=Object.assign({key,rows:[]},o);issues.set(key,i)}if(r!=null&&!i.rows.includes(r))i.rows.push(r);return i};
  let items,inApp=0,differs=[];
  if(S.mode==='reg'){const x=regItems();items=x.items;inApp=x.inApp;differs=x.differs}else items=S.RAW;
  S.itemByR=new Map(items.map(x=>[x.r,x]));
  const carry=S.mode!=='reg';
  const prev={day:null,t:null,cust:null};
  const newCust=new Map();const newCyl=new Map();
  for(const R of items){
    const row={r:R.r,R,skip:D[R.r+'|row']==='skip',open:0,day:null,t:null,cust:null,ids:[]};rowsOut.push(row);
    const openIf=(iss,val)=>{if(val==null&&!row.skip){iss.open=(iss.open||0)+1;row.open++}return val};
    // ---- date
    {const k=R.r+'|date',d=D[k];const p=parseDate(R.date);let iss=null,val=null;
      const nb=carry?{prev:prev.day,next:null}:{prev:R.prev,next:R.next};
      if(p&&okDay(p.day))val=p.day;
      else if(R.appDay!=null&&!d){val=R.appDay;cleaned.push({r:R.r,from:cellTxt(R.date),to:fmtDay(R.appDay),app:1})}
      else if(R.appNoDate&&!d){val=-1;cleaned.push({r:R.r,from:cellTxt(R.date)||'—',to:t('no date (as in the app)'),app:1})}
      else if(!p&&blank(R.date)){
        if(carry&&prev.day!=null)iss=addIss(k,{kind:'date',msg:m('dateAbove'),sugg:m('dateAboveS',{v:fmtDay(prev.day)}),sv:prev.day,block:true,edit:'date'},R.r);
        else iss=addIss(k,{kind:'date',msg:carry?m('dateEmpty'):m('dateEmptyR'),block:true,edit:'date'},R.r);
      }else{
        let sv=null,sug=null;
        if(p&&p.day>TODAY&&p.swap!=null&&okDay(p.swap)){sv=p.swap;sug=m('dateSwapS',{v:fmtDay(sv)})}
        if(sv==null){const b=bestDate(R.date,nb.prev,nb.next);if(b!=null){sv=b;sug=m('dateFixS',{v:fmtDay(b)})}}
        const msg=!p?m('dateBad',{raw:cellTxt(R.date)}):p.day>TODAY?m('dateFuture',{raw:fmtDay(p.day)}):m('dateOld',{raw:fmtDay(p.day)});
        iss=addIss(k,{kind:'date',msg,sugg:sug,sv,no:p&&p.day<MIN_DAY?'keep':null,block:true,edit:'date'},R.r);
      }
      if(iss){iss.dec=d;val=d&&d.a==='set'?d.v:d&&d.a==='yes'&&iss.sv!=null?iss.sv:d&&d.a==='no'&&iss.no==='keep'&&p?p.day:null;openIf(iss,val)}
      row.day=val;if(val!=null)prev.day=val}
    // ---- type
    {const k=R.r+'|type',d=D[k];const p=parseType(R.type);let iss=null,val=null;
      if(p&&p!=='bad')val=p;
      else if(!p&&carry&&prev.t)iss=addIss(k,{kind:'type',msg:m('typeAbove'),sugg:m('typeAboveS',{v:prev.t}),sv:prev.t,block:true,edit:'type'},R.r);
      else iss=addIss(k,{kind:'type',msg:m('typeBad',{raw:R.type||'—'}),block:true,edit:'type'},R.r);
      if(iss){iss.dec=d;val=d&&d.a==='set'?d.v:d&&d.a==='yes'&&iss.sv?iss.sv:null;openIf(iss,val)}
      row.t=val;if(val)prev.t=val}
    // ---- customer
    {const raw=String(R.cust??'').replace(/\s+/g,' ').trim();let val=null,iss=null;
      const rk=R.r+'|cust',rd=D[rk];
      if(rd&&rd.a==='set'){const c=S.custBySlug.get(slug(rd.v));val=c||rd.v;if(!c)newCust.set(slug(rd.v),rd.v);
        iss=addIss(rk,{kind:'cust',msg:raw?m('custMatch',{raw}):m('custAbove'),block:true,edit:'cust'},R.r);iss.dec=rd}
      else if(!raw){
        if(row.t==='MT')val='';
        else if(carry&&prev.cust){iss=addIss(rk,{kind:'cust',msg:m('custAbove'),sugg:m('custAboveS',{v:prev.cust}),sv:prev.cust,block:true,edit:'cust'},R.r);iss.dec=rd;val=rd&&rd.a==='yes'?prev.cust:null;openIf(iss,val)}
        else{iss=addIss(rk,{kind:'cust',msg:m('custEmpty'),block:true,edit:'cust'},R.r);iss.dec=rd;openIf(iss,null)}
      }else{
        const exact=S.custBySlug.get(slug(raw));
        const appC=R.appCn&&S.custBySlug.get(slug(R.appCn));
        if(exact)val=exact;
        else if(appC&&!D['cust|'+slug(raw)]){val=appC;cleaned.push({r:R.r,from:raw,to:appC,app:1})}
        else{const gk='cust|'+slug(raw),d=D[gk];const b=bestCust(raw);
          if(b){iss=addIss(gk,{kind:'custm',msg:m('custMatch',{raw}),sugg:m('custMatchS',{v:b}),sv:b,no:'new',block:true,edit:'cust',raw},R.r)}
          else iss=addIss(gk,{kind:'custn',msg:m('custNew',{raw}),sugg:m('custNewS',{raw}),sv:'new',block:true,edit:'cust',raw},R.r);
          iss.dec=d;
          if(d&&d.a==='skip')row.skip=true;
          if(d&&d.a==='set'){const c=S.custBySlug.get(slug(d.v));val=c||d.v;if(!c)newCust.set(slug(d.v),d.v)}
          else if(d&&d.a==='yes'){if(iss.sv==='new'){val=raw;newCust.set(slug(raw),raw)}else val=iss.sv}
          else if(d&&d.a==='no'&&iss.no==='new'){val=raw;newCust.set(slug(raw),raw)}
          openIf(iss,val);
        }
      }
      row.cust=val;if(val)prev.cust=val}
    // ---- cylinders
    {const ids=[];
      if(R.ids){R.ids.forEach(x=>ids.push(x))}
      else{
        const toks=splitCyl(R.cyl);
        if(!toks.length){const k=R.r+'|cyl0',d=D[k];const iss=addIss(k,{kind:'cyl',msg:m('cylEmpty'),block:true,edit:'cyl'},R.r);iss.dec=d;
          if(d&&d.a==='set')splitCyl(d.v).forEach(x=>ids.push(x.id));openIf(iss,ids.length?1:null)}
        toks.forEach((tk,i)=>{
          if(tk.raw.toUpperCase().replace(/\s+/g,'')!==tk.id)cleaned.push({r:R.r,from:tk.raw,to:tk.id});
          const k=R.r+'|c'+i,d=D[k];
          if(d&&d.a==='set'){splitCyl(d.v).forEach(x=>ids.push(x.id));const iss=addIss(k,{kind:'cyl',msg:m('cylFix',{raw:tk.raw}),block:true,edit:'cyl'},R.r);iss.dec=d;return}
          if(d&&d.a==='skip'){const iss=addIss(k,{kind:'cyl',msg:m('cylFix',{raw:tk.raw}),block:true,edit:'cyl'},R.r);iss.dec=d;return}
          if(S.known.has(tk.id)){ids.push(tk.id);return}
          const rg=rangeOf(tk.id);
          if(rg){const gk='range|'+tk.id,gd=D[gk];const iss=addIss(gk,{kind:'range',msg:m('cylRange',{raw:tk.raw}),sugg:m('cylRangeS',{n:rg.ids.length,a:rg.a,b:rg.b}),sv:rg.ids,block:true,edit:'cyl',ekey:k},R.r);iss.dec=gd;
            if(gd&&gd.a==='yes')rg.ids.forEach(x=>ids.push(x));else if(gd&&gd.a==='set')splitCyl(gd.v).forEach(x=>ids.push(x.id));else if(!(gd&&gd.a==='skip'))openIf(iss,null);return}
          const fx=fixCyl(tk.id);
          if(fx){const gk='fix|'+tk.id,gd=D[gk];const iss=addIss(gk,{kind:'fix',msg:m('cylFix',{raw:tk.raw}),sugg:m('cylFixS',{v:fx}),sv:fx,no:'keep',block:true,edit:'cyl',ekey:k},R.r);iss.dec=gd;
            if(gd&&gd.a==='yes'){ids.push(fx);return}
            if(gd&&gd.a==='set'){splitCyl(gd.v).forEach(x=>ids.push(x.id));return}
            if(gd&&gd.a==='skip')return;
            if(!(gd&&gd.a==='no')){openIf(iss,null);return}}
          ids.push(tk.id);
        });
      }
      // unknown cylinders: decided once per number for the whole file
      const final=[];
      for(const id of [...new Set(ids)]){
        if(S.known.has(id)){final.push(id);continue}
        const h=S.hints&&S.hints[id];
        const gk='new|'+id,gd=D[gk];const iss=addIss(gk,{kind:'cyln',msg:m('cylNew',{raw:id}),sugg:h?m('cylNewS',{id,g:h.g,b:h.b?' · '+brLabel(h.b):''}):null,sv:h?'hint':null,block:true,id},R.r);iss.dec=gd;
        if(gd&&gd.a==='new'){final.push(id);newCyl.set(id,{g:gd.g,b:gd.b})}
        else if(gd&&gd.a==='yes'&&h){final.push(id);newCyl.set(id,{g:h.g,b:h.b})}
        else if(gd&&gd.a==='set'){splitCyl(gd.v).forEach(x=>final.push(x.id))}
        else if(gd&&gd.a==='skip'){}
        else openIf(iss,null);
      }
      row.ids=[...new Set(final)];
    }
  }
  // ---- movements + checks
  const evs=[];const seen=new Map();
  for(const row of rowsOut){
    if(row.skip||row.open||row.day==null||!row.t)continue;
    for(const id of row.ids){
      const e={r:row.r,id,day:row.day,t:row.t,cn:row.cust||'',w:[],key:'w|'+row.r+'|'+id};
      const fk=id+'|'+e.t+'|'+e.day;
      let ex=S.exKeys.get(fk);if(ex==='old'&&S.mode==='reg'&&S.regMode==='replace')ex=null;
      if(ex)e.w.push({kind:'inapp',msg:m('dupApp',{t:e.t,d:fmtDay(e.day)}),def:'skip'});
      else if(S.mode!=='reg'&&seen.has(fk))e.w.push({kind:'dup',msg:m('dupFile',{r:String(seen.get(fk)).replace(':',' · ')}),def:'skip'});
      else seen.set(fk,row.r);
      const lf=S.logFirst.get(id);if(lf!=null&&e.day>=0&&e.day>lf&&!ex)e.w.push({kind:'after',msg:m('afterApp',{d:fmtDay(lf)}),def:'import'});
      evs.push(e);
    }
  }
  const decideE=e=>{const d=S.D[e.key];if(d)return d.a;return e.w.some(w=>w.def==='skip')?'skip':'import'};
  // DC/MT order check on what will actually be imported, together with the history already in the app
  const byCyl=new Map();
  evs.forEach((e,i)=>{e.i=i;if(decideE(e)==='import'){if(!byCyl.has(e.id))byCyl.set(e.id,[]);byCyl.get(e.id).push(e)}});
  if(!(S.mode==='reg'&&S.regMode==='replace'))for(const [id,list] of byCyl){
    list.sort((a,b)=>a.day-b.day||a.i-b.i);
    const ex=S.exSeq.get(id)||{hist:[],log:[]};
    const seq=[];let j=0;
    for(const h of ex.hist){while(j<list.length&&h.day>=0&&h.day>list[j].day){seq.push(list[j++])}seq.push(h)}
    while(j<list.length)seq.push(list[j++]);
    ex.log.forEach(l=>seq.push(l));
    let pv=null;
    for(const it of seq){
      if(it.key){const pt=pv?pv.t:null,pc=pv&&pv.cn||'';
        if(it.t==='DC'){if(pt==='DC')it.w.push({kind:'seq',msg:m('seqDC',{c:pc||'?'}),def:'import'});else if(pt==='FS')it.w.push({kind:'seq',msg:m('seqFS'),def:'import'})}
        else if(it.t==='MT'){if(pt!=='DC')it.w.push({kind:'seq',msg:m('seqMT'),def:'import'});else if(it.cn&&pc&&slug(it.cn)!==slug(pc))it.w.push({kind:'seq',msg:m('seqMTc',{n:it.cn,c:pc}),def:'import'})}
      }
      pv=it;
    }
  }
  const all=[...issues.values()];
  const need=all.filter(i=>i.open);
  const ready=evs.filter(e=>decideE(e)==='import');
  const usedCust=new Set(ready.map(e=>slug(e.cn)));const usedCyl=new Set(ready.map(e=>e.id));
  let removed=[];
  if(S.mode==='reg'&&S.regMode==='replace'){
    const inFile=new Set();for(const x of S.REG){const id=x.id||x.newId;const d=S.D['new|'+id];if(x.id||!(d&&d.a==='skip'))inFile.add(id)}
    removed=[...S.cylMaster.keys()].filter(id=>!inFile.has(id)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(id=>{
      const hasApp=!!((S.exSeq.get(id)||{}).log||[]).length;const d=S.D['rm|'+id];
      return {id,hasApp,g:(S.cylMaster.get(id)||{}).g||'',b:(S.cylMaster.get(id)||{}).b||'',keep:d?d.a==='keep':hasApp}});
  }
  S.A={issues:all,need,rows:rowsOut,evs,ready,decideE,cleaned,inApp,differs,items:items.length,removed,
    newCust:[...newCust.entries()].filter(([k])=>usedCust.has(k)).map(([,v])=>v),
    newCyl:[...newCyl.entries()].filter(([k])=>usedCyl.has(k)),
    warnEvs:evs.filter(e=>e.w.some(w=>w.kind!=='inapp')),
    dupEvs:evs.filter(e=>e.w.some(w=>w.kind==='inapp')),
    skippedRows:rowsOut.filter(r=>r.skip)};
}

function pageOf(items,id,per=PER){

function rerun(){const y=window.scrollY;analyze();render();window.scrollTo(0,y)}
const findIss=k=>S.A.issues.find(i=>i.key===k);
function rowSkipKeys(i){return /^[^|]+\|(date|type|cust|cyl0)$/.test(i.key)?[i.rows[0]+'|row']:null}
function act(a,k){
  const i=findIss(k);if(!i)return;
  if(a==='yes'){S.D[k]={a:'yes'};return rerun()}
  if(a==='no'){S.D[k]={a:'no'};return rerun()}
  if(a==='clear'){delete S.D[k];return rerun()}
  if(a==='skip'){const rk=rowSkipKeys(i);if(rk)S.D[rk[0]]='skip';else S.D[k]={a:'skip'};return rerun()}
  if(a==='new'){const g=document.querySelector(`[data-g="${CSS.escape(k)}"]`).value,b=document.querySelector(`[data-b="${CSS.escape(k)}"]`).value;S.D[k]={a:'new',g,b};return rerun()}
  if(a==='edit'){
    const box=document.querySelector(`[data-ed="${CSS.escape(k)}"]`);box.hidden=false;
    let inp='';
    if(i.edit==='date')inp=`<input class="inp" type="date" max="${isoFromDay(TODAY)}" data-in>`;
    else if(i.edit==='type')inp=`<select class="inp" data-in><option value="DC">DC</option><option value="MT">MT</option></select>`;
    else if(i.edit==='cust')inp=`<input class="inp" list="dl-cust" placeholder="${esc(t('Pick a customer'))}" value="${esc(i.raw||'')}" data-in style="min-width:240px">`;
    else inp=`<input class="inp mono" list="dl-cyl" placeholder="505, 506" value="${esc(i.id||'')}" data-in style="min-width:200px">`;
    box.innerHTML=`<div class="acts">${inp}<button class="btn sm primary" data-save>${esc(t('Save'))}</button><button class="btn sm" data-cancel>${esc(t('Cancel'))}</button></div>`;
    const el=box.querySelector('[data-in]');el.focus();
    box.querySelector('[data-cancel]').onclick=()=>{box.hidden=true;box.innerHTML=''};
    const save=()=>{let v=el.value.trim();if(!v)return;
      if(i.edit==='date'){v=dayFromIso(v);if(v==null)return}
      // a cylinder correction for one token of one row is stored on that row's token
      const key=(i.kind==='fix'||i.kind==='range')&&i.rows.length===1&&i.ekey?i.ekey:k;
      S.D[key]={a:'set',v};rerun()};
    box.querySelector('[data-save]').onclick=save;el.onkeydown=e=>{if(e.key==='Enter')save()};
  }
}
function bulk(a,kind){
  const items=S.A.need.filter(i=>i.kind===kind);
  items.forEach(i=>{
    if(a==='yes'&&i.sugg)S.D[i.key]={a:'yes'};
    else if(a==='new'&&kind==='cyln'){const h=(S.hints||{})[i.id];S.D[i.key]=h?{a:'yes'}:{a:'new',g:guessGas(i.id),b:(S.company.branches||[])[0]||''}}
    else if(a==='skip'){const rk=rowSkipKeys(i);if(rk)S.D[rk[0]]='skip';else S.D[i.key]={a:'skip'}}
  });
  rerun();
}

/* ================= file reading ================= */
async function readFile(file){
  S.loadingFile=file.name;render();
  await new Promise(r=>setTimeout(r,30));
  try{
    S.buf=await file.arrayBuffer();S.file=file.name;S.sheetCache={};
    // first only the top rows of every sheet (fast even for a big workbook), to find the right sheet
    S.wb=XLSX.read(S.buf,{type:'array',raw:true,sheetRows:14});
  }catch(e){console.warn(e);S.loadingFile=null;render();return toast(t('Could not read this file.'))}
  const peek=n=>{const ws=S.wb.Sheets[n];if(!ws||!ws['!ref'])return null;return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''})};
  const best=S.wb.SheetNames.find(n=>{const g=peek(n);return g&&findRegister(g)})||S.wb.SheetNames.find(n=>{const g=peek(n);return g&&g.some(r=>(r||[]).some(c=>!blank(c)))})||S.wb.SheetNames[0];
  pickSheet(best);S.loadingFile=null;
  if(S.grid.length<2){render();return toast(t('This file has no rows.'))}
  S.step='map';render();
}
function sheetFull(name){
  if(S.sheetCache[name])return S.sheetCache[name];
  const wb=XLSX.read(S.buf,{type:'array',raw:true,sheets:[name]});return S.sheetCache[name]=wb.Sheets[name];
}
function pickSheet(name){
  S.sheet=name;let ws=null;try{ws=sheetFull(name)}catch(e){console.warn(e)}
  S.grid=[];
  if(ws&&ws['!ref']){const r=XLSX.utils.decode_range(ws['!ref']);
    // very large empty ranges (e.g. a cache sheet) are cut down to something readable
    r.s.r=0;r.s.c=0;r.e.r=Math.min(r.e.r,30000);r.e.c=Math.min(r.e.c,400);
    S.grid=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:'',blankrows:true,range:r});
    while(S.grid.length&&(S.grid[S.grid.length-1]||[]).every(blank))S.grid.pop()}
  const reg=findRegister(S.grid);
  if(reg){S.mode='reg';S.hdr=reg.hdr;S.reg=reg}else{S.mode='list';S.hdr=guessHeader(S.grid)}
  S.map=guessMap(S.grid[S.hdr],name);
}

/* ================= writing ================= */
const CHUNK=7000;
async function readHist(){
  const q=await fs.collection('hist').get();let meta={cyl:[],cust:[],count:0,chunks:0};const chunks=[];const ids=[];
  q.docs.forEach(d=>{ids.push(d.id);const v=FB.dec(d.data());if(d.id==='meta')meta=v;else if(Array.isArray(v.ev))chunks[v.i]=v.ev});
  return {meta,all:[].concat(...chunks.filter(Boolean)),ids};
}
function writeHist(b,H,all){
  const n=Math.max(1,Math.ceil(all.length/CHUNK));
  for(let i=0;i<n;i++)b.set(fs.doc('hist/e'+i),FB.enc({ev:all.slice(i*CHUNK,(i+1)*CHUNK),i}));
  H.ids.filter(id=>/^e\d+$/.test(id)&&+id.slice(1)>=n).forEach(id=>b.delete(fs.doc('hist/'+id)));
  return n;
}
async function doImport(){
  if(S.mode==='reg'&&S.regMode==='replace')return doReplace();
  const A=S.A;if(A.need.length||!A.ready.length||S.busy)return;
  if(A.ready.length>20000)return toast(m('tooMany',{n:A.ready.length}));
  const lines=[m('sumImp',{n:A.ready.length})];if(A.newCust.length)lines.push(m('sumCust',{n:A.newCust.length})+' '+A.newCust.slice(0,6).join(', ')+(A.newCust.length>6?' …':''));
  if(A.newCyl.length)lines.push(m('sumCyl',{n:A.newCyl.length})+' '+A.newCyl.slice(0,8).map(x=>x[0]).join(', ')+(A.newCyl.length>8?' …':''));
  if(!confirm(lines.join('\n\n')))return;
  S.busy=true;render();
  try{
    const H=await readHist();const meta=H.meta;meta.cyl=meta.cyl||[];meta.cust=meta.cust||[];
    const ci=new Map(meta.cyl.map((c,i)=>[c,i])),ui=new Map(meta.cust.map((c,i)=>[c,i]));
    const cIdx=id=>{if(!ci.has(id)){ci.set(id,meta.cyl.length);meta.cyl.push(id)}return ci.get(id)};
    const uIdx=n=>{if(!n)return -1;if(!ui.has(n)){ui.set(n,meta.cust.length);meta.cust.push(n)}return ui.get(n)};
    const news=A.ready.map((e,i)=>({e,i})).sort((a,b)=>a.e.day-b.e.day||a.i-b.i).map(x=>x.e);
    // put each new movement just before that cylinder's first old movement with a later date
    const firstLater=new Map();const before=new Map();const tail=[];
    const byCyl=new Map();H.all.forEach((ev,pos)=>{const id=meta.cyl[ev[0]];if(!byCyl.has(id))byCyl.set(id,[]);byCyl.get(id).push(pos)});
    for(const e of news){const ps=byCyl.get(e.id)||[];let at=-1;for(const p of ps){const dd=H.all[p][2];if(dd>=0&&dd>e.day){at=p;break}}
      const tup=[cIdx(e.id),e.t==='MT'?1:0,e.day,uIdx(e.cn)];
      if(at<0)tail.push(tup);else{if(!before.has(at))before.set(at,[]);before.get(at).push(tup)}}
    const all=[];H.all.forEach((ev,p)=>{if(before.has(p))all.push(...before.get(p));all.push(ev)});all.push(...tail);
    const b=fs.batch();
    const n=writeHist(b,H,all);
    const maxDay=Math.max(...news.map(e=>e.day));const asOf=meta.asOf&&dayFromIso(meta.asOf)>maxDay?meta.asOf:isoFromDay(maxDay);
    b.set(fs.doc('hist/meta'),FB.enc(Object.assign({},meta,{count:all.length,chunks:n,asOf})));
    const at=new Date().toISOString();
    if(A.newCust.length){const list={};A.newCust.forEach(nm=>{list[slug(nm)]={n:nm,t:'Other',ph:'',ad:'',by:S.me.id,at,imp:true}});b.set(fs.doc('cust/all'),{list},{merge:true})}
    if(A.newCyl.length){const list={};A.newCyl.forEach(([id,v])=>{list[id]={g:v.g,b:v.b,r:'',td:'',add:{by:S.me.id,at,imp:true}}});b.set(fs.doc('cyl/m1'),{list},{merge:true})}
    const id='imp_'+Date.now().toString(36);
    b.set(fs.doc('reg/'+id),{file:S.file,sheet:S.sheet,at,by:S.me.id,n:news.length,rows:JSON.stringify(news.map(e=>[e.id,e.t,e.day,e.cn,e.r])),newCust:A.newCust,newCyl:A.newCyl.map(x=>x[0])});
    await b.commit();
    S.result={n:news.length,file:S.file};S.step='done';await loadAll();await loadPast();
  }catch(e){console.error(e);toast(t('Could not save. Check your connection and try again.'))}
  S.busy=false;render();window.scrollTo(0,0);
}
/* Full copy of the app data as a .json file — the same format import.html loads, so it can restore it. */
async function backupJson(tag){
  const out=await window.FBC.backupAll();
  const d=new Date();const name=`Cylinder desk backup ${tag} ${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()} ${pad(d.getHours())}-${pad(d.getMinutes())}.json`;
  const blob=new Blob([JSON.stringify(out)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  return name;
}
async function doReplace(){
  const A=S.A;if(A.need.length||S.busy)return;
  const keepIds=new Set(A.removed.filter(x=>x.keep).map(x=>x.id));
  // cylinder list from the file
  const list={};const at=new Date().toISOString();
  for(const x of S.REG){const id=x.id||x.newId;
    if(!x.id){const d=S.D['new|'+id];if(d&&d.a==='skip')continue}
    const old=S.cylMaster.get(id)||{};const e=Object.assign({},old);
    e.g=old.g&&fam(old.g)===fam(x.g)&&!/\d/.test(x.g)?old.g:x.g;
    e.b=x.b||old.b||'';
    if(/^MISSING/.test(x.sec)){if(old.r!=='SOLD')e.r='MISSING'}else if(old.r==='MISSING')e.r='';
    if(e.r==null)e.r='';if(!x.id&&!old.add)e.add={by:S.me.id,at,imp:true};
    list[id]=e}
  for(const id of keepIds)list[id]=S.cylMaster.get(id);
  const oc=S.cylMaster.size,oh=[...S.exSeq.values()].reduce((a,v)=>a+v.hist.length,0);
  if(!confirm(m('repConfirm',{oc:oc.toLocaleString('en-IN'),oh:oh.toLocaleString('en-IN'),nc:Object.keys(list).length.toLocaleString('en-IN'),nh:A.ready.length.toLocaleString('en-IN'),f:S.file})))return;
  S.busy=true;render();
  try{
    const bname=await backupJson('before replace');
    // old history rebuilt from the file, row by row in column order (as the sheet reads)
    const meta={cyl:[],cust:[]};const ci=new Map(),ui=new Map();
    const cIdx=id=>{if(!ci.has(id)){ci.set(id,meta.cyl.length);meta.cyl.push(id)}return ci.get(id)};
    const uIdx=n=>{if(!n)return -1;if(!ui.has(n)){ui.set(n,meta.cust.length);meta.cust.push(n)}return ui.get(n)};
    const all=A.ready.map(e=>[cIdx(e.id),e.t==='MT'?1:0,e.day,uIdx(e.cn)]);
    // entries the app had kept without a valid date for cylinders that are not in the file stay out; nothing else to carry
    const H=await readHist();
    const b=fs.batch();
    const n=writeHist(b,H,all);
    const maxDay=all.reduce((a,e)=>Math.max(a,e[2]),0);
    b.set(fs.doc('hist/meta'),FB.enc({cyl:meta.cyl,cust:meta.cust,count:all.length,chunks:n,asOf:maxDay?isoFromDay(maxDay):''}));
    // cylinder list: split into documents of up to 700 cylinders
    const ids=Object.keys(list).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));const per=700;const nd=Math.max(1,Math.ceil(ids.length/per));
    for(let i=0;i<nd;i++){const part={};ids.slice(i*per,(i+1)*per).forEach(id=>part[id]=list[id]);b.set(fs.doc('cyl/m'+i),{list:part})}
    const cq=await fs.collection('cyl').get();cq.docs.forEach(d=>{const k=/^m(\d+)$/.exec(d.id);if(!k||+k[1]>=nd)b.delete(fs.doc('cyl/'+d.id))});
    if(A.newCust.length){const cl={};A.newCust.forEach(nm=>{cl[slug(nm)]={n:nm,t:'Other',ph:'',ad:'',by:S.me.id,at,imp:true}});b.set(fs.doc('cust/all'),{list:cl},{merge:true})}
    // earlier "add" imports can no longer be undone after a replace
    S.past.forEach(p=>b.delete(fs.doc('reg/'+p.id)));
    b.set(fs.doc('reg/imp_'+Date.now().toString(36)),{kind:'replace',file:S.file,sheet:S.sheet,at,by:S.me.id,n:all.length,cyl:ids.length,backup:bname});
    await b.commit();
    S.result={n:all.length,file:S.file,replace:true,nc:ids.length,backup:bname};S.step='done';await loadAll();await loadPast();
  }catch(e){console.error(e);toast(t('Could not save. Check your connection and try again.'))}
  S.busy=false;render();window.scrollTo(0,0);
}
async function undoImport(id){
  if(!confirm(t('This undoes the import: its movements are removed from the old history. Customers and cylinders it added stay. Continue?')))return;
  try{
    const s=await fs.doc('reg/'+id).get();if(!s.exists)return;const rows=JSON.parse(s.data().rows||'[]');
    const H=await readHist();const meta=H.meta;
    const want=new Map();rows.forEach(([cid,tt,day,cn])=>{const k=cid+'|'+(tt==='MT'?1:0)+'|'+day+'|'+(cn||'');want.set(k,(want.get(k)||0)+1)});
    const all=[];for(let p=H.all.length-1;p>=0;p--){const ev=H.all[p];const k=meta.cyl[ev[0]]+'|'+ev[1]+'|'+ev[2]+'|'+(ev[3]>=0?meta.cust[ev[3]]:'');
      if(want.get(k)>0){want.set(k,want.get(k)-1);continue}all.push(ev)}
    all.reverse();
    const b=fs.batch();const n=writeHist(b,H,all);
    b.set(fs.doc('hist/meta'),FB.enc(Object.assign({},meta,{count:all.length,chunks:n})));
    b.delete(fs.doc('reg/'+id));await b.commit();
    toast(t('Undone.'));await loadAll();await loadPast();render();
  }catch(e){console.error(e);toast(t('Could not save. Check your connection and try again.'))}
}
