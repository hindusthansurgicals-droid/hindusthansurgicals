<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{scroll-padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>HSAP Cylinder Desk</title>
<meta name="theme-color" content="#0E6B5A"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Cylinder Desk"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3.19.0"><link rel="icon" href="icon.svg?v=3.19.0" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png?v=3.19.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: operations desk — fixed left rail of sections, a working surface on the right; on phones the rail becomes a scrolling tab strip under the header. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEB; --line:#D3DCD8;
  --ink:#13201C; --muted:#5A6A65; --accent:#0E6B5A; --accent-2:#0A5143; --on-accent:#FFFFFF;
  --ok:#2C7A3A; --ok-bg:#E3F1E5; --warn:#A8670B; --warn-bg:#FBEFD9; --crit:#B3261E; --crit-bg:#FBE4E1; --info:#1F5B8E; --info-bg:#E2ECF6; --mt:#C2185B; --mt-bg:#FBE3EC;
  --gas-o2:#2F6FB0; --gas-co2:#6B7280; --gas-n2:#3C3F46; --gas-ar:#0E8A8A; --gas-duro:#8A5A18;
  --shadow:0 1px 2px rgba(19,32,28,.06),0 8px 24px rgba(19,32,28,.08);
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --line:#2A3631;
  --ink:#E3EBE7; --muted:#93A39D; --accent:#4CB89D; --accent-2:#6FCDB5; --on-accent:#08201A;
  --ok:#6CC27A; --ok-bg:#16301C; --warn:#E3AA4F; --warn-bg:#33270F; --crit:#F2766B; --crit-bg:#3A1714; --info:#7FB2E0; --info-bg:#132637; --mt:#F06C9B; --mt-bg:#3A1426;
  --gas-o2:#6FA5DB; --gas-co2:#A3A9B3; --gas-n2:#C3C6CC; --gas-ar:#45C2C2; --gas-duro:#D09A52;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --line:#2A3631;
  --ink:#E3EBE7; --muted:#93A39D; --accent:#4CB89D; --accent-2:#6FCDB5; --on-accent:#08201A;
  --ok:#6CC27A; --ok-bg:#16301C; --warn:#E3AA4F; --warn-bg:#33270F; --crit:#F2766B; --crit-bg:#3A1714; --info:#7FB2E0; --info-bg:#132637; --mt:#F06C9B; --mt-bg:#3A1426;
  --gas-o2:#6FA5DB; --gas-co2:#A3A9B3; --gas-n2:#C3C6CC; --gas-ar:#45C2C2; --gas-duro:#D09A52;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
#dash-body{display:flex;flex-direction:column;gap:16px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.brand>div{min-width:0}
.brand-mark{width:34px;height:34px;border-radius:8px;background:#fff;display:grid;place-items:center;flex:none;border:1px solid var(--line);overflow:hidden}
.brand-mark img{width:100%;height:100%;display:block}
.brand h1{font:800 16px/1.1 var(--f-display);letter-spacing:.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:500 11px/1.2 var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
@media (max-width:600px){.top-right{gap:6px}.top-right .btn.ghost{padding:5px 6px}}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.who img{width:26px;height:26px;border-radius:50%}
.role-pill{font:600 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.layout{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:calc(100% - 52px)}
.rail{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(52px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 52px)}
.rail button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.rail button svg{width:18px;height:18px;flex:none}
.rail button:hover{background:var(--surface-2);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--surface);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line)}
.rail .badge{margin-left:auto}
.rail-foot{margin-top:auto;padding:10px;font-size:11.5px;color:var(--muted)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:calc(51px + env(safe-area-inset-top,0px));z-index:15;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);background:var(--bg);padding:6px max(10px,env(safe-area-inset-left,0px));gap:4px;scrollbar-width:none}
  .rail button{white-space:nowrap;padding:7px 10px}
  .rail-foot{display:none}
  .who span{display:none}
  .brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
}

/* type */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.page-head h2{font:800 24px/1.1 var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.005em}
.page-head p{margin:4px 0 0;color:var(--muted)}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
h3{font:700 15px/1.2 var(--f-display);margin:0;letter-spacing:.01em}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-head .muted{margin-left:auto;font-size:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stat{padding:14px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.stat:first-child{border-left:0}
.stat b{font:800 28px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
@media (max-width:1000px) and (min-width:701px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat:nth-child(4){border-left:0}.stat:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{border-left:0;border-top:1px solid var(--line)}.stat:nth-child(-n+2){border-top:0}.stat:nth-child(even){border-left:1px solid var(--line)}}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--crit)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:12px;font-weight:600;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:38px}
textarea.inp{min-height:60px;resize:vertical}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1 1 160px}
.search{position:relative;flex:1 1 220px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search .inp{padding-left:32px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface-2);gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* type toggle on entry */
.typepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
@media (max-width:1100px){.typepick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.typepick button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.typepick b{font:800 20px/1 var(--f-display)}
.typepick span{overflow-wrap:anywhere}
.typepick span{font-size:12.5px;color:var(--muted)}
.typepick button[aria-pressed="true"].dc{border-color:var(--info);background:var(--info-bg)}
.typepick button[aria-pressed="true"].dc b{color:var(--info)}
.typepick button[aria-pressed="true"].mt{border-color:var(--mt);background:var(--mt-bg)}
.typepick button[aria-pressed="true"].mt b{color:var(--mt)}
.typepick button[aria-pressed="true"].fs{border-color:var(--warn);background:var(--warn-bg)}
.typepick button[aria-pressed="true"].fs b{color:var(--warn)}
.typepick button[aria-pressed="true"].fr{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.typepick button[aria-pressed="true"].fr b{color:var(--accent)}

/* pills, chips */
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--f-body);padding:4px 8px;border-radius:999px;white-space:nowrap}
.pill.out{background:var(--info-bg);color:var(--info)}
.pill.in{background:var(--ok-bg);color:var(--ok)}
.pill.unused{background:var(--surface-2);color:var(--muted)}
.pill.missing,.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.sold{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.t-dc{color:var(--info);font-weight:700}
.t-mt{color:var(--mt);font-weight:700}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--crit);color:#fff;font:700 11px/20px var(--f-body);text-align:center}
.gas{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.gas::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--gc,var(--muted))}
.cyl{font:600 13px/1 var(--f-mono);letter-spacing:.02em;padding:4px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
button.cyl{cursor:pointer}
button.cyl:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 13.5px/1 var(--f-mono);padding:6px 6px 6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface)}
.chip.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:var(--ok-bg)}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:var(--warn-bg)}
.chip.crit{border-color:color-mix(in srgb,var(--crit) 55%,var(--line));background:var(--crit-bg)}
.chip button{border:0;background:none;padding:0 3px;font-size:15px;line-height:1;color:var(--muted)}
.chip-note{font:500 11.5px/1.2 var(--f-body);color:var(--muted)}
.chip-list{display:flex;flex-direction:column;gap:6px}
.chip-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cylbox{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);min-height:46px}
.cylbox input{border:0;outline:0;background:none;flex:1 1 140px;min-width:120px;font:600 15px var(--f-mono);padding:6px 4px;text-transform:uppercase}
.cylbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.expect{display:flex;flex-wrap:wrap;gap:6px}
.expect button{font:600 13px/1 var(--f-mono);padding:6px 8px;border-radius:7px;border:1px dashed var(--line);background:none}
.expect button:hover{border-style:solid;border-color:var(--ok);color:var(--ok)}
.expect button[disabled]{opacity:.4;text-decoration:line-through}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font:600 11.5px/1.2 var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex;min-width:80px}
.bar i{display:block;height:100%}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 15px var(--f-display);margin-bottom:4px}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:10px;font-size:12.5px;color:var(--muted)}

/* aging strip */
.aging{display:flex;flex-direction:column;gap:9px}
.aging .ar{display:grid;grid-template-columns:96px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.aging .ar .bar{height:12px}

/* timeline */
.trip{display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 10px}
.trip .dot{width:12px;height:12px;border-radius:50%;margin:4px auto 0;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.trip .line{width:2px;background:var(--line);margin:0 auto}
.trip .body{padding-bottom:14px;min-width:0}
.trip .body b{font-weight:600}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,15,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer-head h3{font-size:18px}
.drawer-body{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1}
.drawer-body>*{flex:none}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kv span{font-size:11.5px;color:var(--muted)}
.kv b{font-weight:600;overflow-wrap:anywhere}
@media (max-width:520px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* misc */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:60;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.notice{border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.notice.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink)}
.notice.crit{background:var(--crit-bg);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.notice.info{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.notice svg{width:18px;height:18px;flex:none;margin-top:1px}
.dd{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);z-index:25;max-height:300px;overflow-y:auto}
.dd button{display:flex;width:100%;border:0;background:none;padding:9px 12px;text-align:left;gap:8px;align-items:center}
.dd button[aria-selected="true"],.dd button:hover{background:var(--surface-2)}
.dd .sub{margin-left:auto;font-size:12px;color:var(--muted)}
.dd .town{font-size:12px;color:var(--muted)}
.dd .ed{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;color:var(--muted);flex:none}
.dd .ed:hover{background:var(--surface);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line)}
.dd .ed svg{width:14px;height:14px}
.brtag{display:inline-block;font:600 10.5px/1 var(--f-body);padding:3px 6px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.brtag.d{background:var(--info-bg);color:var(--info)}
.brtag.k{background:color-mix(in srgb,#8A4FB3 14%,var(--surface));color:#8A4FB3}
.brtag.b{background:var(--surface-2);color:var(--muted)}
.datebox{position:relative;display:flex;align-items:center}
.tabbar{display:none}
.notice.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.fl-mode{margin-top:10px}
.fl-read{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1fr) 110px;gap:6px 10px;align-items:center;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.fl-read .frh{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fl-read>label{font-weight:600;font-size:13px}
.fl-used{font-family:var(--f-mono);color:var(--accent);font-size:13px}
table.ledger tr.own td{background:color-mix(in srgb,#F59E0B 8%,var(--surface))}
table.ledger td.trk{color:var(--info);font-weight:700}

/* ---------------- number series ---------------- */
const isNum=v=>/^\d+$/.test(String(v||''));
/* One DC series and one MT series for all branches (the app's own running numbers). */
function seriesRecs(t,br){return S.D.recs.filter(r=>!r.del&&r.t===t&&isNum(r.dc))}
const fmtNo=n=>String(+n).padStart(4,'0');
function nextNo(t,br){if(!isCust(t))return '';let mx=0;for(const r of seriesRecs(t,br)){const n=+r.dc;if(n>mx)mx=n}return fmtNo(mx+1)}
function noCheck(f){
  if(!isCust(f.t)||!isNum(f.dc))return null;
  if(f.dcAuto&&!f.edit)return null;
  const n=+f.dc;const rs=seriesRecs(f.t,f.br).filter(r=>!(f.edit&&r.rid===f.edit.rid));
  const dup=rs.find(r=>+r.dc===n);
  if(dup&&!f.edit)return {k:'crit',msg:`${f.t} no. ${n} is already used: ${recTitle(dup)} on ${fmtD(dup.d)}.`};
  return null; // numbers are put in date order by themselves after saving
  let lo=null,hi=null;rs.forEach(r=>{const x=+r.dc;if(x<n&&(!lo||x>+lo.dc))lo=r;if(x>n&&(!hi||x<+hi.dc))hi=r});
  if(lo&&f.d<lo.d)return {k:'warn',msg:`${f.t} ${lo.dc} is dated ${fmtD(lo.d)}, so ${n} cannot be earlier.`,date:lo.d};
  if(hi&&f.d>hi.d)return {k:'warn',msg:`${f.t} ${hi.dc} is dated ${fmtD(hi.d)}, so ${n} should be on or before that date.`,date:lo&&lo.d<=hi.d?lo.d:hi.d};
  if(hi)return {k:'ok',msg:`Fills the gap between ${f.t} ${lo?lo.dc+' ('+fmtD(lo.d)+')':'start'} and ${hi.dc} (${fmtD(hi.d)}). It will be placed in number order.`};
  if(lo&&n-(+lo.dc)>1)return {k:'warn',msg:`Last ${f.t} is ${lo.dc}. Numbers ${+lo.dc+1}${n-(+lo.dc)>2?' to '+(n-1):''} will show as missing.`};
  return null;
}
function gaps(t,br){const rs=seriesRecs(t,br).map(r=>+r.dc).sort((a,b)=>a-b);const have=new Set(rs);const vd=S.voids||{};const out=[];
  if(rs.length<2)return out;for(let n=rs[0];n<=rs[rs.length-1];n++){if(!have.has(n)&&!vd[br+'_'+t+'_'+n])out.push(n)}return out}
const rangesTxt=a=>{const o=[];for(let i=0;i<a.length;){let j=i;while(j+1<a.length&&a[j+1]===a[j]+1)j++;o.push(i===j?String(a[i]):a[i]+'–'+a[j]);i=j+1}return o.join(', ')};
/* ---------------- money ---------------- */
const fmtAmt=n=>(Math.round(n*100)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function words(n){n=Math.round(n);if(!n)return 'Zero';const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
  const parts=[];const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;
  if(cr)parts.push(two(cr)+' Crore');if(lk)parts.push(two(lk)+' Lakh');if(th)parts.push(two(th)+' Thousand');if(n)parts.push(three(n));return parts.join(' ')}
function billCfg(){return Object.assign({prefix:'INV',gst:'',price:{},hsn:{}},S.company.bill||{})}
function refillPrice(ck,g){const c=S.cust[ck]||{};const k=gasKey(g);const own=c.pr&&c.pr[k];return own!=null&&own!==''?+own:(+billCfg().price[k]||0)}
function invoices(){const out=[];for(const [docId,doc] of Object.entries(S.bill||{})){for(const [id,v] of Object.entries(doc.inv||{})){if(v&&v.no)out.push(Object.assign({id,docId},v))}}
  return out.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.no-a.no)}
const invPaid=v=>Object.values(v.paid||{}).reduce((s,p)=>s+(+p.amt||0),0);
const invNo=v=>`${v.pre||billCfg().prefix}/${v.br}/${v.no}`;

const numCmp=(a,b)=>{if(a.t===b.t&&a.br===b.br&&isNum(a.dc)&&isNum(b.dc)&&a.dc!==b.dc)return (+a.dc)-(+b.dc);return (a.at||'')<(b.at||'')?-1:(a.at||'')>(b.at||'')?1:0};

          if(due){const m=Object.assign({id},ev,{flag:'MT not entered — filled at factory on '+fmtD(ev.d)+' (over '+PEND_DAYS+' days)',ck:prev.ck});mism.push(m)}else pend.push(it)}

      if(ev.src==='new'){
        let f=null;const pt=prev?prev.t:null;const pn=prev&&prev.ck?custName(prev.ck):'';
        if(!S.cyl[id])f='Cylinder number not in master list';
        else if(ev.t==='DC'){if(pt==='DC')f='Already with '+pn+' (MT not entered?)';else if(pt==='FS')f='At filling plant (not received back?)'}
        else if(ev.t==='MT'){if(pt!=='DC')f='Already in godown (DC not entered?)';else if(prev.ck!==ev.ck)f='This cylinder was with '+pn}
        else if(ev.t==='FS'){if(pt==='DC')f='With '+pn+' (MT not entered?)';else if(pt==='FS')f='Already at filling'}
        else if(ev.t==='FR'){if(pt==='DC')f='With '+pn+' (MT not entered?)'}
        const fa=f&&!ev.vf?fillsAfter(ev.d):[];
        if(f&&fa.length&&daysSince(fa[0])<=PEND_DAYS){ev.flag=null;ev.pendFlag=f;pend.push({id,kind:'flag',ck:ev.ck,t:ev.t,d:ev.d,dc:ev.dc||'',flag:f,fillD:fa[0],docId:ev.docId,rid:ev.rid})}
        else{ev.flag=f&&fa.length?f+' · filled '+fmtD(fa[0]):f;if(f)mism.push(Object.assign({id},ev))}
      }
      if(ev.ck){lastCk=ev.ck;if(ev.d&&(!lastMove[ev.ck]||ev.d>lastMove[ev.ck]))lastMove[ev.ck]=ev.d}
      if(ev.t==='FS')lastPl=ev.pl||'';
      prev=ev;
    }
    const c=S.cyl[id]||{};
    let st='unused',d=null;
    if(prev){d=prev.d;st=prev.t==='MT'&&prev.full?'full':(ST[prev.t]||'empty')}
    const ck=st==='out'?prev.ck:lastCk;
    const r=(c.r||'').toUpperCase();
    if(r==='MISSING')st='missing';else if(r==='SOLD')st='sold';
    const days=daysSince(d);
    const td=c.td||'';const tdue=!td?'none':td<tm?'over':td<=soon?'soon':'ok';
    state[id]={id,st,ck,d,days,g:c.g||'?',b:c.b||'',r:c.r||'',known:!!S.cyl[id],n:evs.length,td,tdue,pl:st==='filling'?lastPl:''};
    if(st==='out'){(holding[ck]=holding[ck]||[]).push(state[id])}
  }
  const custMoves={};
  for(const [id,evs] of Object.entries(tl)){for(const ev of evs){if(!ev.ck)continue;(custMoves[ev.ck]=custMoves[ev.ck]||[]).push(Object.assign({id},ev))}}
  for(const k in holding)holding[k].sort((a,b)=>(b.days??-1)-(a.days??-1));
  recs.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:-numCmp(a,b));
  S.D={tl,state,mism,holding,custMoves,recs,lastMove,today,pend,fills,PEND_DAYS};
}

function bootData(){
  const db=S.db;
  const err=e=>{console.warn(e);if(e&&e.code==='revoked'){S.readOnly=true}};
  db.doc('settings/company').onSnapshot(s=>{if(s.exists)S.company=Object.assign({},S.company,s.data());S.loaded.company=true;paintBrand();scheduleDerive()},err);
  db.doc('settings/roles').onSnapshot(s=>{const before=role();S.roles=(s.exists&&s.data().users)||{};if(S.loaded.roles&&!before&&role()){location.reload();return}S.loaded.roles=true;paintShell();scheduleDerive()},err);
  db.doc('cust/all').onSnapshot(s=>{S.custDoc=s.exists;S.cust=(s.exists&&s.data().list)||{};S.loaded.cust=true;scheduleDerive()},err);
  db.collection('bill').onSnapshot(q=>{const m={};q.docs.forEach(d=>{if(!d.id.startsWith('lock_'))m[d.id]=d.data()});S.bill=m;scheduleDerive()},err);
  db.doc('trade/buy').onSnapshot(s=>{S.trade.buy=(s.exists&&s.data().lots)||{};scheduleDerive()},err);
  db.doc('trade/sell').onSnapshot(s=>{S.trade.sell=(s.exists&&s.data().sales)||{};scheduleDerive()},err);
  db.doc('dealers/list').onSnapshot(d=>{S.dealers=(d.exists&&d.data().list)||{};if(S.view==='fill'&&!S.drawer)scheduleDerive()},err);
  db.collection('fill').onSnapshot(q=>{const m={};q.docs.forEach(d=>{m[d.id]=d.data()});S.fills=m;scheduleDerive()},err);
  db.collection('insp').onSnapshot(q=>{const m={};q.docs.forEach(d=>{m[d.id]=d.data()});S.insps=m;scheduleDerive()},err);
  db.doc('reg/void').onSnapshot(s=>{S.voids=(s.exists&&s.data().list)||{};scheduleDerive()},err);
  db.collection('cyl').onSnapshot(q=>{const m={},src={};q.docs.forEach(d=>{const l=(d.data()||{}).list||{};for(const k in l){m[k]=l[k];src[k]=d.id}});S.cyl=m;S.cylSrc=src;S.loaded.cyl=true;scheduleDerive()},err);
  db.collection('hist').get().then(q=>{
    let meta=null;const ch=[];
    q.docs.forEach(d=>{const v=d.data();if(d.id==='meta')meta=v;else if(Array.isArray(v.ev))ch[v.i]=v.ev});
    S.hist=meta?{meta,chunks:ch.filter(Boolean)}:null;S.loaded.hist=true;scheduleDerive();
  }).catch(e=>{err(e);S.loaded.hist=true;scheduleDerive()});
  // logs: one query per month from Sep 2026 to now; live for the last two months
  const start=new Date(2026,8,1);const now=new Date();const months=[];
  for(let d=new Date(start);d<=now;d.setMonth(d.getMonth()+1))months.push(d.getFullYear()+'-'+pad(d.getMonth()+1));
  let pending=months.length;
  const done=()=>{if(--pending<=0){S.loaded.logs=true}scheduleDerive()};
  months.forEach((m,i)=>{
    const [y,mo]=m.split('-').map(Number);const nx=mo===12?(y+1)+'-01':y+'-'+pad(mo+1);
    const q=db.collection('log').where('date','>=',m+'-01').where('date','<',nx+'-01').limit(1000);
    const apply=snap=>{const keep={};snap.docs.forEach(d=>{keep[d.id]=d.data()});
      for(const k of Object.keys(S.logs)){if(k.slice(0,7)===m&&!(k in keep))delete S.logs[k]}
      Object.assign(S.logs,keep)};
    if(i>=months.length-2){let first=true;q.onSnapshot(s=>{apply(s);if(first){first=false;done()}else scheduleDerive()},e=>{err(e);if(first){first=false;done()}})}
    else q.get().then(s=>{apply(s);done()}).catch(e=>{err(e);done()});
  });
}

/* Back button (phone and browser): closes an open popup first, then goes to the previous page. */
const HIST={pop:false,stale:false,init:false};
function histPush(st){try{history.pushState(st,'')}catch(e){}}
window.addEventListener('popstate',e=>{const st=e.state||{};
  if(S.drawer){S.drawer=null;$('#drawer-root').innerHTML='';HIST.stale=false;return}
  if(!st.v||st.v===S.view){history.back();return} // an entry left by a popup closed with ✕ — skip it
  if(st.v&&st.v!==S.view){HIST.pop=true;go(st.v);HIST.pop=false}});

/* Typed dates: 24-9-26 · 24/09/2026 · 24.9.26 · 240926 · 24092026 · 24-9 (this year) → ISO, or null */
function parseTypedDate(v,defYear){
  let s=String(v||'').trim();if(!s)return null;let d,m,y;
  const now=new Date();let x;const Y=+defYear||now.getFullYear();
  if((x=/^(\d{1,2})\D+(\d{1,2})\D+(\d{2}|\d{4})$/.exec(s))){d=+x[1];m=+x[2];y=+x[3]}
  else if((x=/^(\d{1,2})\D+(\d{1,2})$/.exec(s))){d=+x[1];m=+x[2];y=Y}
  else if((x=/^(\d{2})(\d{2})$/.exec(s))){d=+x[1];m=+x[2];y=Y}
  else if((x=/^(\d{2})(\d{2})(\d{2}|\d{4})$/.exec(s))){d=+x[1];m=+x[2];y=+x[3]}
  else if((x=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s))){y=+x[1];m=+x[2];d=+x[3]}
  else return null;
  if(y<100)y+=2000;if(m<1||m>12||d<1||d>31||y<2000||y>2100)return null;
  const iso=y+'-'+pad(m)+'-'+pad(d);const t=new Date(Date.UTC(y,m-1,d));
  return t.getUTCDate()===d&&t.getUTCMonth()===m-1?iso:null;
}

  if(f.t==='DC'){

      if(r&&short&&r>todayISO()){const y=+r.slice(0,4)-1;const r2=y+r.slice(4);if(r2<=todayISO()){r=r2;note=ta()?`${y} என எடுத்துக்கொண்டது`:`Taken as ${y}`}}

      if(q&&!exact&&can('newCust'))html+=`<button type="button" data-new="1" aria-selected="${items.length===sel}">${ic('plus','style="width:15px;height:15px"')}<span>Add “${esc(ci.value.trim())}” as a new customer</span></button>`;
      dd.innerHTML=html;dd.hidden=!html;ci.setAttribute('aria-expanded',String(!!html));
    };
    const pick=ck=>{
      {const b=custBr(ck).br;if(!f.edit&&b&&b!=='BOTH'&&b!==f.br&&S.company.branches.includes(b)){
        if(can('otherBr')){f.br=b;const sel=$('#f-br');if(sel)sel.value=b;if(isCust(f.t)&&f.dcAuto){f.dc=nextNo(f.t,f.br);const d=$('#f-dc');if(d)d.value=f.dc}toast((LANG==='ta'?'கிளை தானாக மாறியது: ':'Branch changed to ')+brName(b))}
        else toast((LANG==='ta'?'இந்த customer ':'This customer is ')+brName(b)+(LANG==='ta'?' கிளை — உங்கள் கிளையில் பதிவாகிறது':' — saving under your branch'))}}
      f.ck=ck;f.cq='';ci.value=custName(ck);dd.hidden=true;ci.setAttribute('aria-expanded','false');this.update();$('#f-cyl').focus()};

async function addCustomer(name){

/* Loose date for filters: 21-10, 21-10-26, 10 (a month), 10-26 (month-year). No year → the latest one that is not in the future. */
function looseDate(v,end){
  v=String(v||'').trim();if(!v)return '';const now=new Date();const Y=now.getFullYear(),M=now.getMonth()+1,today=todayISO();
  const last=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
  let x;
  if((x=/^(\d{1,2})$/.exec(v))){const m=+x[1];if(m<1||m>12)return null;const y=m>M?Y-1:Y;return y+'-'+pad(m)+'-'+(end?pad(last(y,m)):'01')}
  if((x=/^(\d{1,2})\D+(\d{2}|\d{4})$/.exec(v))&&+x[2]>12){const m=+x[1];let y=+x[2];if(y<100)y+=2000;if(m<1||m>12)return null;return y+'-'+pad(m)+'-'+(end?pad(last(y,m)):'01')}
  let r=parseTypedDate(v,Y);if(!r)return null;
  if(/^\d{1,2}\D+\d{1,2}$/.test(v)&&r>today)r=(+r.slice(0,4)-1)+r.slice(4);
  return r}
const remEvery=()=>+S.company.fuDays||30;
function remDue(ck){const c=S.cust[ck]||{};const h=S.D.holding[ck]||[];const n=remEvery();if(!h.some(s=>s.days!=null&&s.days>=n))return false;
  return !c.rem||daysSince(String(c.rem.at).slice(0,10))>=n}
function outDc(id){const ev=S.D.tl[id]||[];for(let i=ev.length-1;i>=0;i--)if(ev[i].t==='DC')return ev[i].dc||'';return ''}
VIEWS.fu={
  mount(){const u=S.ui;if(u.fuMin==null){u.fuMin='1';u.fuMax=''}const ta=LANG==='ta';this._pre=this._vh=null;
    return `<div class="page-head"><div><h2>${ta?'வெளியே உள்ள சிலிண்டர்கள் — நாட்கள் & நினைவூட்டல்':'Cylinders out — days & reminders'}</h2><p>${ta?'எத்தனை நாள் வெளியே உள்ளது என்று 1-ஆம் நாளிலிருந்து எந்த வரம்பிலும் பார்க்கலாம். ஒவ்வொரு '+remEvery()+' நாளுக்கும் நினைவூட்ட வேண்டியவர்கள் தனியாக வருவார்கள்.':'See cylinders out for any number of days, from day 1. Customers due for a reminder (every '+remEvery()+' days) are listed separately.'}</p></div></div>
    <div class="panel"><div class="tchips" id="fu-pre"></div>
    <div class="row" style="margin-top:12px">
      <div class="field" style="flex:0 1 210px"><label>${ta?'நாட்கள்':'Days out'}</label><div class="row" style="gap:6px;align-items:center;flex-wrap:nowrap"><input class="inp num" id="fu-min" type="number" min="0" value="${esc(u.fuMin)}" style="max-width:80px" placeholder="1"><span class="muted">${ta?'முதல்':'to'}</span><input class="inp num" id="fu-max" type="number" min="0" value="${esc(u.fuMax)}" style="max-width:80px" placeholder="∞"></div></div>
      <div class="field" style="flex:0 1 260px"><label>${ta?'DC தேதி (எ.கா. 1-9, 9, 30-9-26)':'DC date (e.g. 1-9, 9, 30-9-26)'}</label><div class="row" style="gap:6px;align-items:center;flex-wrap:nowrap"><input class="inp mono" id="fu-from" value="${esc(u.fuFrom||'')}" placeholder="${ta?'முதல்':'from'}" style="max-width:110px"><span class="muted">–</span><input class="inp mono" id="fu-to" value="${esc(u.fuTo||'')}" placeholder="${ta?'வரை':'to'}" style="max-width:110px"></div><div class="small muted" id="fu-dmsg"></div></div>
      <div class="field" style="flex:0 1 150px"><label for="fu-br">${ta?'கிளை':'Branch'}</label><select class="inp" id="fu-br"><option value="all">${ta?'எல்லாம்':'All'}</option>${S.company.branches.map(b=>`<option value="${esc(b)}" ${u.fuBr===b?'selected':''}>${esc(brName(b))}</option>`).join('')}</select></div>
      <div class="field search"><label for="fu-q">${ta?'Customer / சிலிண்டர்':'Customer / cylinder'}</label><div class="rel">${ic('search')}<input class="inp" id="fu-q" value="${esc(u.fuQ||'')}" placeholder="Search"></div></div>
      <div class="field" style="flex:0 1 auto"><label>${ta?'காட்டும் விதம்':'View'}</label><div class="seg" id="fu-view"></div></div>
      ${canManage()?`<div class="field" style="flex:0 1 auto"><label for="fu-every">🔔 ${ta?'நினைவூட்டல் இடைவெளி':'Remind every'}</label><div class="row" style="gap:6px;align-items:center;flex-wrap:nowrap"><input class="inp num" id="fu-every" type="number" min="1" value="${remEvery()}" style="max-width:76px"><span class="muted">${ta?'நாள்':'days'}</span><button class="btn sm" type="button" data-act="remset">${ta?'சேமி':'Save'}</button></div></div>`:''}
    </div></div><div id="fu-list" style="display:flex;flex-direction:column;gap:12px"></div>`},
  after(){const u=S.ui;const upd=()=>this.update();
    $('#fu-min').addEventListener('input',e=>{u.fuMin=e.target.value;u.fuDue=false;upd()});$('#fu-max').addEventListener('input',e=>{u.fuMax=e.target.value;u.fuDue=false;upd()});
    $('#fu-from').addEventListener('change',e=>{u.fuFrom=e.target.value;upd()});$('#fu-to').addEventListener('change',e=>{u.fuTo=e.target.value;upd()});
    $('#fu-br').addEventListener('change',e=>{u.fuBr=e.target.value;upd()});$('#fu-q').addEventListener('input',e=>{u.fuQ=e.target.value;upd()});
    $('#fu-pre').addEventListener('click',e=>{const b=e.target.closest('[data-pr]');if(!b)return;const v=b.dataset.pr;
      if(v==='due'){u.fuDue=!u.fuDue}else if(v==='clear'){u.fuMin='1';u.fuMax='';u.fuFrom='';u.fuTo='';u.fuQ='';u.fuBr='all';u.fuDue=false;$('#fu-from').value='';$('#fu-to').value='';$('#fu-q').value='';$('#fu-br').value='all'}
      else{const [a,z]=v.split('-');u.fuMin=a;u.fuMax=z||'';u.fuDue=false}
      $('#fu-min').value=u.fuMin;$('#fu-max').value=u.fuMax;upd()});
    $('#fu-view').addEventListener('click',e=>{const b=e.target.closest('[data-fv]');if(!b)return;u.fuView=b.dataset.fv;upd()});
    upd()},
  filt(){const u=S.ui;const ta=LANG==='ta';const mn=u.fuMin===''?0:+u.fuMin,mx=u.fuMax===''?Infinity:+u.fuMax;
    const f=looseDate(u.fuFrom,false),t=looseDate(u.fuTo,true);const msg=[];
    if(f===null)msg.push(ta?'“முதல்” தேதி புரியவில்லை':'“from” date not understood');else if(f)msg.push(fmtD(f));
    if(t===null)msg.push(ta?'“வரை” தேதி புரியவில்லை':'“to” date not understood');else if(t)msg.push('→ '+fmtD(t));
    const dm=$('#fu-dmsg');if(dm)dm.textContent=msg.join(' ');
    const q=(u.fuQ||'').trim().toLowerCase();
    const cyls=[];
    for(const [ck,h] of Object.entries(S.D.holding)){
      if(u.fuDue&&!remDue(ck))continue;
      if(u.fuBr&&u.fuBr!=='all'){const b=custBr(ck).br;if(b!==u.fuBr&&b!=='BOTH')continue}
      const cn=custName(ck).toLowerCase();
      for(const x of h){if(x.days==null)continue;if(x.days<mn||x.days>mx)continue;if(f&&x.d<f)continue;if(t&&x.d>t)continue;
        if(q&&!cn.includes(q)&&!String(x.id).toLowerCase().includes(q))continue;cyls.push(x)}}
    return cyls},
  update(){const u=S.ui;const ta=LANG==='ta';const cyls=this.filt();
    const P=[['1-30','1–30'],['31-60','31–60'],['61-90','61–90'],['91-180','91–180'],['181-','180+'],['1-','All']];
    const dueN=Object.keys(S.D.holding).filter(remDue).length;
    const preH=P.map(([v,l])=>`<button type="button" data-pr="${v}" aria-pressed="${!u.fuDue&&(u.fuMin+'-'+u.fuMax)===v}">${l} ${ta?'நாள்':'days'}</button>`).join('')+
      `<button type="button" data-pr="due" aria-pressed="${!!u.fuDue}">🔔 ${ta?'நினைவூட்ட வேண்டியவர்கள்':'Reminder due'} <span class="n">${dueN}</span></button><button type="button" data-pr="clear" class="clr">✕ ${ta?'அழி':'Clear'}</button>`;
    /* only redraw the buttons when they change, so a click is not lost while a date box is being left */
    if(this._pre!==preH){this._pre=preH;$('#fu-pre').innerHTML=preH}
    const view=u.fuView||'cust';
    const vH=[['cust',ta?'Customer வாரியாக':'By customer'],['cyl',ta?'சிலிண்டர் வாரியாக':'By cylinder']].map(([k,l])=>`<button data-fv="${k}" aria-pressed="${view===k}">${l}</button>`).join('');if(this._vh!==vH){this._vh=vH;$('#fu-view').innerHTML=vH}
    if(!cyls.length){$('#fu-list').innerHTML=`<div class="panel empty"><b>${ta?'பொருந்தும் சிலிண்டர் இல்லை':'No cylinders match'}</b>${ta?'நாட்கள் / தேதி வரம்பை மாற்றவும்.':'Change the days or dates.'}</div>`;return}
    const byC={};cyls.forEach(x=>(byC[x.ck]=byC[x.ck]||[]).push(x));
    const head=`<div class="small muted">${Object.keys(byC).length} ${ta?'customer':'customers'} · ${cyls.length} ${ta?'சிலிண்டர்':'cylinders'}</div>`;
    if(view==='cyl'){const rows=cyls.slice().sort((a,b)=>b.days-a.days);
      $('#fu-list').innerHTML=head+`<div class="panel"><div class="tbl-wrap"><table><thead><tr><th>${ta?'சிலிண்டர்':'Cylinder'}</th><th>Gas</th><th>Customer</th><th>DC</th><th>${ta?'DC தேதி':'DC date'}</th><th class="r">${ta?'நாட்கள்':'Days'}</th></tr></thead><tbody>${rows.slice(0,600).map(x=>`<tr class="click" data-act="opencyl" data-v="${esc(x.id)}"><td><b class="mono">${esc(x.id)}</b></td><td>${gasTag?gasTag(x.g):esc(x.g)}</td><td><a href="#" data-act="opencust" data-v="${esc(x.ck)}">${esc(custName(x.ck))}</a> ${brTag(x.ck)}</td><td class="mono small">${esc(outDc(x.id))}</td><td class="num">${fmtD(x.d)}</td><td class="r"><span class="pill ${x.days>90?'crit':x.days>30?'warn':'ok'} num">${x.days}</span></td></tr>`).join('')}</tbody></table></div>${rows.length>600?`<div class="small muted">+${rows.length-600}</div>`:''}</div>`;return}
    const groups=Object.entries(byC).map(([ck,h])=>({ck,c:S.cust[ck]||{n:ck},h:h.sort((a,b)=>b.days-a.days)})).sort((a,b)=>b.h[0].days-a.h[0].days);
    $('#fu-list').innerHTML=head+groups.map(r=>{const fu=r.c.fu,rm=r.c.rem;const due=remDue(r.ck);return `<div class="panel" style="display:flex;flex-direction:column;gap:10px">
      <div class="row" style="align-items:flex-start"><div style="flex:1 1 220px;min-width:0"><h3><a href="#" data-act="opencust" data-v="${esc(r.ck)}">${esc(r.c.n)}</a> ${brTag(r.ck)} ${due?`<span class="pill warn">🔔 ${ta?'நினைவூட்ட வேண்டும்':'Reminder due'}</span>`:''}</h3>
        <div class="small muted" style="margin-top:3px">${r.c.ph?`📞 <a href="tel:${esc(telOf(r.c.ph))}">${esc(r.c.ph)}</a>`:(ta?'Phone இல்லை':'No phone')} · ${r.h.length} ${ta?'சிலிண்டர்':'cyl'} · ${ta?'அதிகபட்சம்':'longest'} ${r.h[0].days} ${ta?'நாள்':'days'}${rm?` · ${ta?'கடைசி நினைவூட்டல்':'last reminder'} ${fmtDT(rm.at)}`:''}</div>
        ${fu?`<div class="small" style="margin-top:4px"><span class="pill unused">${ta?'கடைசி பேச்சு':'Last follow-up'} ${fmtDT(fu.at)}</span> ${esc(fu.note||'')}</div>`:''}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm wa" data-act="remwa" data-v="${esc(r.ck)}">${ic('wa')}WhatsApp</button><button class="btn sm" data-act="remcopy" data-v="${esc(r.ck)}">${ta?'நகல்':'Copy'}</button><button class="btn sm" data-act="remdone" data-v="${esc(r.ck)}">${ic('check')}${ta?'நினைவூட்டியது':'Reminded'}</button>${canEnter()?`<button class="btn sm" data-act="logcall" data-v="${esc(r.ck)}">${ta?'பேச்சு குறிப்பு':'Log call'}</button>`:''}</div></div>
      <div class="chips">${r.h.map(s=>`<button class="cyl" data-act="opencyl" data-v="${esc(s.id)}" title="DC ${esc(outDc(s.id))} · ${fmtD(s.d)}" style="${s.days>90?'border-color:var(--crit)':s.days>30?'border-color:var(--warn)':''}">${esc(s.id)} <span class="muted" style="font-family:var(--f-body)">${s.days}d</span></button>`).join('')}</div></div>`}).join('')}
};
/* Reminder text: the cylinders now shown for that customer (or all of theirs over the reminder interval). */
function fuMessage(ck,list){
  let h=list;if(!h){const sh=S.view==='fu'&&VIEWS.fu.filt?VIEWS.fu.filt().filter(x=>x.ck===ck):[];h=sh.length?sh:(S.D.holding[ck]||[]).filter(s=>s.days>=remEvery())}
  if(!h.length)h=S.D.holding[ck]||[];
  const d=Math.min(...h.map(s=>s.days||0));
  const tpl=S.company.fuMsg||DEFAULT_FU_MSG;
  return tpl.replace(/\{customer\}/g,custName(ck)).replace(/\{count\}/g,h.length).replace(/\{days\}/g,d).replace(/\{cylinders\}/g,h.map(s=>s.id+' ('+s.days+' days'+(outDc(s.id)?', DC '+outDc(s.id):'')+', '+fmtD(s.d)+')').join(', ')).replace(/\{company\}/g,S.company.name||'').replace(/\{phone\}/g,S.company.phone||'')}
async function markReminded(ck){if(!S.isOwner&&(viewOnly()||!['manager','staff'].includes(role())))return;try{await S.db.doc('cust/all').update({list:{[ck]:{rem:{at:new Date().toISOString(),by:S.uid}}}});if(S.cust[ck])S.cust[ck].rem={at:new Date().toISOString(),by:S.uid};if(S.view==='fu')VIEWS.fu.update()}catch(e){toast(dbErr(e))}}

/* ---------------- Physical inspection ---------------- */
const canInsp=()=>role()&&!S.readOnly&&(S.isOwner||(['manager','staff'].includes(role())&&!viewOnly()&&can('insp')));
function inspRecs(){const out=[];for(const [docId,doc] of Object.entries(S.insps||{}))for(const [rid,r] of Object.entries((doc&&doc.recs)||{})){if(r&&!r.del)out.push(Object.assign({},r,{rid,docId}))}return out.sort((a,b)=>(b.at||'').localeCompare(a.at||''))}
function inspFindings(){const out=[];for(const r of inspRecs()){const res=r.res||{};(r.miss||[]).forEach(c=>{if(!res[c])out.push({k:'miss',c,r})});(r.extra||[]).forEach(c=>{if(!res[c])out.push({k:'extra',c,r})})}return out}
function gpsOnce(ms=9000){return new Promise(res=>{if(!navigator.geolocation)return res(null);let done=false;const t=setTimeout(()=>{if(!done){done=true;res(null)}},ms);
  navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(t);res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)})},()=>{if(done)return;done=true;clearTimeout(t);res({denied:true})},{enableHighAccuracy:true,timeout:ms,maximumAge:60000})})}
const mapLink=l=>l&&l.lat!=null?`<a href="https://www.google.com/maps?q=${l.lat},${l.lng}" target="_blank" rel="noopener">📍 ${LANG==='ta'?'இடம்':'Map'}${l.acc?` ±${l.acc}m`:''}</a>`:`<span class="muted small">${l&&l.denied?(LANG==='ta'?'📍 அனுமதி இல்லை':'📍 not allowed'):'—'}</span>`;
VIEWS.insp={
  mount(){const u=S.ui;const ta=LANG==='ta';if(!u.inTab)u.inTab='cust';if(u.inBr==null)u.inBr=role()==='staff'?myBranch():'all';
    return `<div class="page-head"><div><h2>Physical inspection</h2><p>${ta?'Customer இடத்துக்குப் போய், app கணக்குப்படி அவரிடம் உள்ள சிலிண்டர்களை நேரில் பார்த்து ✓ / ✗ குறிக்கவும். பட்டியலில் இல்லாததைச் சேர்க்கலாம். Staff பெயர், நேரம், இடம் தானாகச் சேரும்.':'Visit the customer and tick each cylinder you can see. Add any that are not in the list. Your name, time and location are saved.'}</p></div></div>
    <div class="panel"><div class="seg" id="in-tabs"></div>
      <div class="row" style="margin-top:10px"><div class="field search"><label for="in-q">${ta?'Customer தேடு':'Search customer'}</label><div class="rel">${ic('search')}<input class="inp" id="in-q" value="${esc(u.inQ||'')}"></div></div>
      <div class="field" style="flex:0 1 160px"><label for="in-br">${ta?'கிளை':'Branch'}</label><select class="inp" id="in-br"><option value="all">${ta?'எல்லாம்':'All'}</option>${S.company.branches.map(b=>`<option value="${esc(b)}" ${u.inBr===b?'selected':''}>${esc(brName(b))}</option>`).join('')}</select></div></div></div>
    <div id="in-list"></div>`},
  after(){const u=S.ui;$('#in-q').addEventListener('input',e=>{u.inQ=e.target.value;this.update()});$('#in-br').addEventListener('change',e=>{u.inBr=e.target.value;this.update()});
    $('#in-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;u.inTab=b.dataset.t;this.update()});this.update()},
  update(){const u=S.ui;const ta=LANG==='ta';const recs=inspRecs();const finds=inspFindings();
    $('#in-tabs').innerHTML=[['cust',ta?'Customer-கள்':'Customers'],['find',(ta?'கண்டுபிடிப்புகள்':'Findings')+(finds.length?' · '+finds.length:'')],['hist',ta?'வரலாறு':'History']].map(([k,l])=>`<button data-t="${k}" aria-pressed="${u.inTab===k}">${esc(l)}</button>`).join('');
    const q=(u.inQ||'').trim().toLowerCase();const brOk=ck=>{if(!u.inBr||u.inBr==='all')return true;const b=custBr(ck).br;return b===u.inBr||b==='BOTH'};
    const last={};recs.forEach(r=>{if(!last[r.ck])last[r.ck]=r});
    if(u.inTab==='cust'){
      const rows=Object.keys(S.cust).filter(ck=>(S.D.holding[ck]||[]).length&&brOk(ck)&&(!q||custName(ck).toLowerCase().includes(q)));
      const today=todayISO();const done=ck=>last[ck]&&last[ck].d===today;
      rows.sort((a,b)=>(done(a)?1:0)-(done(b)?1:0)||((last[a]||{}).d||'').localeCompare((last[b]||{}).d||'')||(S.D.holding[b].length-S.D.holding[a].length));
      const todo=rows.filter(ck=>!done(ck)),fin=rows.filter(done);
      const row=ck=>{const l=last[ck];return `<button type="button" class="inrow" data-act="inspopen" data-v="${esc(ck)}"><span style="flex:1;min-width:0"><b>${esc(custName(ck))}</b> ${brTag(ck)}<span class="small muted" style="display:block">${l?`${ta?'கடைசி சரிபார்ப்பு':'Last checked'} ${fmtD(l.d)} · ${esc(shortName(l.by))} · ✓${(l.ok||[]).length} ✗${(l.miss||[]).length}${(l.extra||[]).length?' +'+l.extra.length:''}`:(ta?'இதுவரை சரிபார்க்கவில்லை':'Never checked')}</span></span><span class="pill ${done(ck)?'ok':'info'}">${done(ck)?'✓ '+(ta?'இன்று':'today'):(S.D.holding[ck]||[]).length+' '+(ta?'சிலிண்டர்':'cyl')}</span></button>`};
      $('#in-list').innerHTML=`<div class="panel"><div class="panel-head"><h3>${ta?'சரிபார்க்க வேண்டியவை':'To check'} · ${todo.length}</h3><span class="muted small">${ta?'நீண்ட நாள் பார்க்காதவர்கள் முதலில்':'Longest unchecked first'}</span></div>${todo.slice(0,200).map(row).join('')||`<div class="empty"><b>${ta?'எல்லாம் முடிந்தது':'All done'}</b></div>`}</div>

    if(u.inTab==='find'){

async function createInvoice(){
  const u=S.ui;const V=VIEWS.bill;const {rs,lines}=V.lines();if(!rs.length)return;
  const gst=+$('#bn-gst').value||0,d=$('#bn-date').value||todayISO(),br=$('#bn-br').value;const ck=u.bnCust;
  const taxable=Math.round(lines.reduce((s,l)=>s+l.q*l.rate,0)*100)/100;const tax=Math.round(taxable*gst)/100;const total=Math.round((taxable+tax)*100)/100;
  $('#bn-save').disabled=true;
  try{
    const lock=S.db.doc('bill/lock_'+br);let got=false;
    for(let i=0;i<6&&!got;i++){const r=await lock.acquire({holder:S.uid||'x',ttlMs:8000});got=r.acquired;if(!got)await new Promise(z=>setTimeout(z,900))}
    if(!got){toast('Another invoice is being created. Try again in a few seconds.');$('#bn-save').disabled=false;return}
    let mx=0;invoices().forEach(v=>{if(v.br===br&&v.no>mx)mx=v.no});const no=mx+1;
    const id=uidGen();const docId=d.slice(0,7)+'_'+br;const ref=S.db.doc('bill/'+docId);
    const inv={no,pre:billCfg().prefix,br,d,ck,cn:custName(ck),gstin:(S.cust[ck]||{}).gst||'',lines:lines.map(l=>({g:l.g,q:l.q,rate:l.rate,hsn:l.hsn})),gst,taxable,tax,total,dcs:rs.map(r=>[r.docId,r.rid,r.dc||'']),by:S.uid,at:new Date().toISOString()};
    const s=await ref.get();if(s.exists)await ref.update({inv:{[id]:inv}});else await ref.set({month:d.slice(0,7),br,inv:{[id]:inv}});
    S.bill[docId]=S.bill[docId]||{inv:{}};S.bill[docId].inv=Object.assign({},S.bill[docId].inv,{[id]:inv});
    toast('Invoice '+invNo(inv)+' created');u.bnCust='';u.bnSel=null;V._rates=null;V._tab=null;
    formDrawer('Invoice '+invNo(inv),`<p>${esc(custName(ck))} · ₹${fmtAmt(total)} · ${rs.length} DC</p>`,async()=>{await invoicePdf(docId,id);closeDrawer()},'Download PDF');
    V.update();
  }catch(e){toast(dbErr(e));$('#bn-save').disabled=false}
}
async function invoicePdf(docId,id){
  const v=S.bill[docId]&&S.bill[docId].inv[id];if(!v){toast('Invoice not found');return}
  try{await loadScript(JSPDF_SRC)}catch(e){toast('Could not load the PDF tool. Check your connection.');return}
  const {jsPDF}=window.jspdf;const p=new jsPDF({unit:'mm',format:'a4'});const W=210;const co=S.company;const c=S.cust[v.ck]||{};
  p.setFont('helvetica','bold');p.setFontSize(16);p.text(co.name||'',W/2,18,{align:'center'});p.setFont('helvetica','normal');p.setFontSize(9);let y=23;
  (co.addr||'').split(/\n/).forEach(l=>{p.text(l,W/2,y,{align:'center'});y+=4.5});
  const l2=[co.phone?'Ph: '+co.phone:'',co.gst?'GSTIN: '+co.gst:''].filter(Boolean).join('   ');if(l2){p.text(l2,W/2,y,{align:'center'});y+=4.5}
  y+=2;p.line(14,y,W-14,y);y+=8;p.setFont('helvetica','bold');p.setFontSize(13);p.text(v.cancel?'TAX INVOICE (CANCELLED)':'TAX INVOICE',W/2,y,{align:'center'});y+=9;
  p.setFontSize(10);p.text('Invoice No: '+invNo(v),14,y);p.text('Date: '+fmtD(v.d),W-14,y,{align:'right'});y+=7;
  p.text('Bill to:',14,y);p.setFont('helvetica','normal');p.text(custName(v.ck),34,y);y+=5;
  if(c.ad){p.splitTextToSize(c.ad,120).forEach(l=>{p.text(l,34,y);y+=4.5})}
  if(c.ph){p.text('Ph: '+c.ph,34,y);y+=4.5}if(v.gstin||c.gst){p.text('GSTIN: '+(v.gstin||c.gst),34,y);y+=4.5}
  y+=4;const X=[14,26,96,124,146,172];p.setFillColor(230,236,233);p.rect(14,y,W-28,8,'F');p.setFont('helvetica','bold');
  ['S.No','Description','HSN','Qty','Rate','Amount'].forEach((h,i)=>p.text(h,i>=3?X[i]+(i===5?22:16):X[i]+1,y+5.5,i>=3?{align:'right'}:undefined));y+=8;p.setFont('helvetica','normal');
  v.lines.forEach((l,i)=>{p.text(String(i+1),X[0]+1,y+5.5);p.text(l.g+' gas refill',X[1]+1,y+5.5);p.text(l.hsn||'',X[2]+1,y+5.5);p.text(String(l.q),X[3]+16,y+5.5,{align:'right'});p.text(fmtAmt(l.rate),X[4]+16,y+5.5,{align:'right'});p.text(fmtAmt(l.q*l.rate),X[5]+22,y+5.5,{align:'right'});y+=8;p.setDrawColor(210);p.line(14,y,W-14,y)});
  y+=6;const R=(lab,val,b)=>{p.setFont('helvetica',b?'bold':'normal');p.text(lab,150,y,{align:'right'});p.text(val,W-14,y,{align:'right'});y+=6};
  R('Taxable value',fmtAmt(v.taxable));if(v.gst){R('CGST @ '+v.gst/2+'%',fmtAmt(v.tax/2));R('SGST @ '+v.gst/2+'%',fmtAmt(v.tax/2))}R('Total (Rs.)',fmtAmt(v.total),true);
  y+=2;p.setFont('helvetica','normal');p.setFontSize(9);p.text('Rupees '+words(v.total)+' only',14,y);y+=6;
  p.text('Against DC: '+(v.dcs||[]).map(x=>x[2]||'-').join(', '),14,y,{maxWidth:W-28});y+=12;
  y=Math.max(y,250);p.line(W-70,y,W-14,y);p.text('For '+(co.name||''),W-14,y+5,{align:'right'});p.text('Authorised signatory',W-14,y+10,{align:'right'});
  await saveFile(`Invoice ${invNo(v).replace(/\//g,'-')} ${custName(v.ck)}.pdf`,p.output('arraybuffer'));
}

/* Analysis */
VIEWS.ana={
  mount(){return `<div class="page-head"><div><h2>Analysis</h2><p>How cylinders move: monthly volume, how long customers keep them, and who is holding more than they use.</p></div></div>
    <div class="panel"><div class="panel-head"><h3>Monthly movement</h3><span class="muted">last 12 months · <span class="t-dc">■</span> DC out <span class="t-mt">■</span> MT in</span></div><div id="an-chart" style="overflow-x:auto"></div></div>
    <div class="panel"><div class="panel-head"><h3>Customers: usage and extra cylinders</h3><span class="muted">based on the last 90 days</span></div>
    <div class="small muted" style="margin-bottom:10px">Needed = cylinders used per day × average days they keep one. Extra = holding minus needed. A high extra means cylinders are sitting idle at that customer.</div><div id="an-tbl"></div></div>`},
  after(){this.update()},
  update(){const D=S.D;const t=D.today;const months=[];const d0=new Date(+t.slice(0,4),+t.slice(5,7)-1,1);for(let i=11;i>=0;i--){const d=new Date(d0.getFullYear(),d0.getMonth()-i,1);months.push(d.getFullYear()+'-'+pad(d.getMonth()+1))}
    const cnt={};months.forEach(m=>cnt[m]={DC:0,MT:0});
    const cut90=isoFromDay(dayNum(t)-90),cut365=isoFromDay(dayNum(t)-365);const use={},hold={};
    for(const [id,evs] of Object.entries(D.tl)){for(let i=0;i<evs.length;i++){const e=evs[i];if(!e.d)continue;const m=e.d.slice(0,7);if(cnt[m]&&(e.t==='DC'||e.t==='MT'))cnt[m][e.t]++;
      if(e.t==='DC'&&e.ck){if(e.d>=cut90)(use[e.ck]=use[e.ck]||{n:0}).n++;const nx=evs[i+1];if(nx&&nx.t==='MT'&&nx.d&&nx.d>=cut365){const h=hold[e.ck]=hold[e.ck]||{s:0,n:0};h.s+=dayNum(nx.d)-dayNum(e.d);h.n++}}}}
    const mx=Math.max(1,...months.map(m=>Math.max(cnt[m].DC,cnt[m].MT)));const W=760,H=220,pl=40,pb=26,bw=(W-pl-10)/months.length;
    const y=v=>H-pb-(v/mx)*(H-pb-14);const ticks=[0,Math.round(mx/2),mx];
    $('#an-chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px;max-width:100%" role="img" aria-label="Monthly DC and MT counts">
      ${ticks.map(v=>`<line x1="${pl}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join('')}
      ${months.map((m,i)=>{const x=pl+i*bw;const a=cnt[m].DC,b=cnt[m].MT;return `<rect x="${x+bw*0.14}" y="${y(a)}" width="${bw*0.34}" height="${H-pb-y(a)}" fill="var(--info)" rx="2"><title>${m} DC ${a}</title></rect><rect x="${x+bw*0.52}" y="${y(b)}" width="${bw*0.34}" height="${H-pb-y(b)}" fill="var(--mt)" rx="2"><title>${m} MT ${b}</title></rect><text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m.slice(5)-1]}</text>`}).join('')}</svg>`;
    const rows=Object.keys(S.cust).map(ck=>{const h=(D.holding[ck]||[]).length;const u=use[ck]?use[ck].n:0;const hd=hold[ck]&&hold[ck].n?hold[ck].s/hold[ck].n:null;const need=hd!=null?Math.ceil(u/90*hd):null;return {ck,h,u,hd,need,extra:need!=null?h-need:null}}).filter(r=>r.h||r.u).sort((a,b)=>(b.extra??-1e9)-(a.extra??-1e9)||b.h-a.h);
    $('#an-tbl').innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Customer</th><th class="r">Holding</th><th class="r">Used (90 d)</th><th class="r">Per month</th><th class="r">Avg days kept</th><th class="r">Needed</th><th class="r">Extra</th></tr></thead><tbody>${rows.slice(0,150).map(r=>`<tr class="click" data-act="opencust" data-v="${esc(r.ck)}"><td><b>${esc(custName(r.ck))}</b></td><td class="r num">${r.h}</td><td class="r num">${r.u}</td><td class="r num">${(r.u/3).toFixed(1)}</td><td class="r num">${r.hd!=null?Math.round(r.hd):'—'}</td><td class="r num">${r.need??'—'}</td><td class="r">${r.extra==null?'<span class="muted">—</span>':r.extra>=5?`<span class="pill crit num">+${r.extra}</span>`:r.extra>0?`<span class="pill warn num">+${r.extra}</span>`:`<span class="num muted">${r.extra}</span>`}</td></tr>`).join('')}</tbody></table></div>`}
};

function parseTests(txt){const ok=[],bad=[];
  txt.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{const m=line.match(/^(\S+)[\s,;:\t]+(.+)$/);if(!m){bad.push(line);return}
    const id=normCyl(m[1]);const v=m[2].trim();let y,mo;let x;
    if((x=v.match(/^(\d{4})[-\/.](\d{1,2})$/))){y=+x[1];mo=+x[2]}
    else if((x=v.match(/^(\d{1,2})[-\/.](\d{4})$/))){y=+x[2];mo=+x[1]}
    else if((x=v.match(/^(\d{1,2})[-\/.](\d{2})$/))){y=2000+ +x[2];mo=+x[1]}
    if(!S.cyl[id]||!y||mo<1||mo>12||y<2000||y>2100){bad.push(line);return}
    ok.push([id,y+'-'+pad(mo)])});
  return {ok,bad}}

function openDrawer(d){if(!S.drawer)histPush({v:S.view,d:1});S.drawer=d;paintDrawer();setTimeout(()=>{const b=$('.drawer [data-act="closedrawer"]');b&&b.focus()},30)}
function closeDrawer(){if(S.drawer)HIST.stale=true;S.drawer=null;$('#drawer-root').innerHTML=''}
function paintDrawer(){
  const d=S.drawer;if(!d)return;
  if(d.k==='form'&&$('#dform'))return; // do not wipe a form the user is typing in
  const keepScroll=$('.drawer-body')?$('.drawer-body').scrollTop:0;
  let head='',body='';
  if(d.k==='cyl'){[head,body]=cylDrawer(d.v)}
  else if(d.k==='cust'){[head,body]=custDrawer(d.v)}
  else if(d.k==='lot'){[head,body]=lotDrawer(d.v)}
  else if(d.k==='form'){[head,body]=d.render()}
  $('#drawer-root').innerHTML=`<div class="scrim" data-act="closedrawer"></div><aside class="drawer${d.k==='form'?' dlg':''}" role="dialog" aria-modal="true" aria-label="Details"><div class="drawer-head">${head}<button class="btn ghost sm" data-act="closedrawer" style="margin-left:auto" aria-label="Close">${ic('x')}</button></div><div class="drawer-body">${body}</div></aside>`;
  $('.drawer-body').scrollTop=keepScroll;
  if(d.k==='form'&&d.after)d.after();
  if(d.k==='cust'&&S.ui.cd){const u=S.ui.cd;
    const f=$('#cd-from'),t=$('#cd-to'),q=$('#cd-q');
    if(f)f.addEventListener('change',()=>{u.from=f.value;u.n=100;paintDrawer()});
    if(t)t.addEventListener('change',()=>{u.to=t.value;u.n=100;paintDrawer()});
    if(q){q.addEventListener('input',()=>{u.q=q.value;clearTimeout(u.qt);u.qt=setTimeout(()=>{u.n=100;paintDrawer();const n=$('#cd-q');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},250)})}}
  if(d.k==='cyl'){const f=$('#td-form');if(f)f.addEventListener('submit',async e=>{e.preventDefault();const v=$('#td-in').value;const id=d.v;try{await S.db.doc('cyl/'+(S.cylSrc[id]||'m1')).update({list:{[id]:{td:v}}});toast(v?'Test due saved':'Test date cleared')}catch(err){toast(dbErr(err))}})}
}
function cylTrips(id){const evs=S.D.tl[id]||[];const out=[];
  for(let i=0;i<evs.length;i++){const e=evs[i];if(e.t!=='DC')continue;const n=evs[i+1];const back=n&&n.t==='MT'?n:null;
    out.push({e,back,next:n||null,days:back&&e.d&&back.d?dayNum(back.d)-dayNum(e.d):(!n&&e.d?daysSince(e.d):null),open:!n,miss:n&&n.t!=='MT'})}
  return out}

      <div class="field"><label for="nb-l">Cylinders: one per line, number then batch / mfg no.</label><textarea class="inp mono" id="nb-l" style="min-height:150px" placeholder="2701 48990&#10;2702 48991"></textarea></div><p class="small muted">New numbers are added to the cylinder list. Use C, N, A prefixes for CO2, N2, Argon.</p>`,
      async()=>{const sup=$('#nb-s').value.trim();const lines=$('#nb-l').value.split('\n').map(l=>l.trim()).filter(Boolean);if(!sup||!lines.length){toast('Supplier and cylinders are needed');return}
        const g=$('#nb-g').value,b=$('#nb-br').value,td=$('#nb-td').value||'';const items=[],add={};
        lines.forEach(l=>{const [n,...rest]=l.split(/[\s,;\t]+/);const id=normCyl(n);if(!id)return;items.push([id,rest.join(' '),'',id]);if(!S.cyl[id])add[id]={g,b,r:'',td,add:{by:S.uid,at:new Date().toISOString()}}});
        const id='b'+uidGen();const lot={id,sup,d:$('#nb-d').value,bill:$('#nb-b').value.trim(),label:sup+' · '+g,gas:g,items,notes:[],by:S.uid,at:new Date().toISOString()};
        try{if(Object.keys(add).length)await S.db.doc('cyl/m1').update({list:add});const ref=S.db.doc('trade/buy');const s=await ref.get();if(s.exists)await ref.update({lots:{[id]:lot}});else await ref.set({lots:{[id]:lot}});
          toast(`Purchase saved · ${Object.keys(add).length} new cylinders added`);closeDrawer()}catch(e){toast(dbErr(e))}},'Save purchase')},
  newsale:()=>{formDrawer('Sell cylinders',`<div class="row"><div class="field"><label for="ns-d">Date</label><input class="inp" type="date" id="ns-d" value="${todayISO()}"></div><div class="field"><label for="ns-b">Buyer</label><input class="inp" id="ns-b" required></div><div class="field"><label for="ns-a">Amount ₹</label><input class="inp num" type="number" min="0" id="ns-a"></div></div>
      <div class="field"><label for="ns-l">Cylinder numbers</label><textarea class="inp mono" id="ns-l" placeholder="2084, 2121"></textarea></div><div class="field"><label for="ns-n">Note</label><input class="inp" id="ns-n"></div><p class="small muted">These cylinders are marked Sold and leave the stock count.</p>`,
      async()=>{const buyer=$('#ns-b').value.trim();const ids=$('#ns-l').value.split(/[\s,;]+/).map(normCyl).filter(Boolean);if(!buyer||!ids.length){toast('Buyer and cylinders are needed');return}
        const bad=ids.filter(i=>!S.cyl[i]);if(bad.length){toast('Not in the list: '+bad.join(', '));return}
        const id='s'+uidGen();const sale={id,buyer,d:$('#ns-d').value,amt:$('#ns-a').value,items:ids.map(i=>[i,'',i]),note:$('#ns-n').value.trim(),by:S.uid,at:new Date().toISOString()};
        try{const byDoc={};ids.forEach(i=>{const d=S.cylSrc[i]||'m1';(byDoc[d]=byDoc[d]||{})[i]={r:'SOLD'}});for(const [d,list] of Object.entries(byDoc))await S.db.doc('cyl/'+d).update({list});
          const ref=S.db.doc('trade/sell');const s=await ref.get();if(s.exists)await ref.update({sales:{[id]:sale}});else await ref.set({sales:{[id]:sale}});toast('Sale saved');closeDrawer()}catch(e){toast(dbErr(e))}},'Save sale')},
  backupnow:async()=>{const ok=await runReport('backup');if(ok&&canManage()){try{await S.db.doc('settings/company').update({lastBackup:todayISO().slice(0,7)})}catch(e){}}}
});

function custForm(ck,stay){
  if(ck?!can('editCust'):!can('newCust')){toast(LANG==='ta'?'இதற்கு அனுமதி இல்லை. Owner-இடம் கேட்கவும்.':'Not allowed. Ask the owner.');return}const c=ck?S.cust[ck]:{n:'',t:'Hospital',ph:'',ad:''};
  formDrawer(ck?'Edit customer':'Add customer',`<div class="field"><label for="cu-n">Name</label><input class="inp" id="cu-n" required value="${esc(c.n)}"></div>
    <div class="row"><div class="field"><label for="cu-t">Type</label><select class="inp" id="cu-t">${['Hospital','Engineering','Industry','Granite / Metal','Scrap','Home','Other'].map(t=>`<option ${c.t===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="cu-ph">Phone</label><input class="inp" id="cu-ph" value="${esc(c.ph||'')}" inputmode="tel"></div></div>
    <div class="row"><div class="field"><label for="cu-br">Branch</label><select class="inp" id="cu-br"><option value="">${ck&&!c.br&&custBr(ck).br?'Auto: '+(custBr(ck).br==='BOTH'?'Both':brName(custBr(ck).br)):'Auto (from their cylinders)'}</option>${(S.company.branches||[]).map(b=>`<option value="${esc(b)}" ${c.br===b?'selected':''}>${esc(brName(b))}</option>`).join('')}<option value="BOTH" ${c.br==='BOTH'?'selected':''}>Both</option></select></div><div class="field"><label for="cu-town">Town / area</label><input class="inp" id="cu-town" value="${esc(c.town||'')}" placeholder="eg. Pennagaram"></div></div>
    <div class="field"><label for="cu-ad">Address (printed on DC)</label><textarea class="inp" id="cu-ad">${esc(c.ad||'')}</textarea></div>
    <div class="row"><div class="field"><label for="cu-dep">Deposit held (₹)</label><input class="inp num" type="number" min="0" id="cu-dep" value="${esc(c.dep??'')}"></div><div class="field"><label for="cu-rate">Own rent ₹/day</label><input class="inp num" type="number" min="0" step="0.5" id="cu-rate" value="${esc(c.rate??'')}" placeholder="default"></div><div class="field"><label for="cu-free">Own free days</label><input class="inp num" type="number" min="0" id="cu-free" value="${esc(c.free??'')}" placeholder="default"></div></div>
    <div class="field"><label for="cu-gst">Customer GSTIN</label><input class="inp mono" id="cu-gst" value="${esc(c.gst||'')}"></div>
    <div class="field"><label>Own refill price ₹ (blank = default)</label><div class="row">${RENT_GASES.map(g=>`<div class="field" style="flex:1 1 80px"><label for="cu-pr-${g}">${g}</label><input class="inp num" type="number" min="0" step="0.01" id="cu-pr-${g}" data-pr="${g}" value="${esc((c.pr||{})[g]??'')}"></div>`).join('')}</div></div>`,
    async()=>{const n=$('#cu-n').value.replace(/\s+/g,' ').trim();if(!n){toast('Type the name');return}
      const body={n,t:$('#cu-t').value,br:$('#cu-br').value,town:$('#cu-town').value.replace(/\s+/g,' ').trim(),ph:$('#cu-ph').value.trim(),ad:$('#cu-ad').value.trim(),dep:$('#cu-dep').value,rate:$('#cu-rate').value,free:$('#cu-free').value,gst:$('#cu-gst').value.trim(),pr:Object.fromEntries($$('[data-pr]').map(i=>[i.dataset.pr,i.value]))};
      try{if(ck){await S.db.doc('cust/all').update({list:{[ck]:body}});toast('Saved');closeDrawer();if(S.D)delete S.D._cbr;if(stay){const ci=$('#f-cust');if(ci){ci.focus()}}else openDrawer({k:'cust',v:ck})}
        else{const k=slug(n);if(S.cust[k]){toast(n+' already exists');return}if(S.custDoc)await S.db.doc('cust/all').update({list:{[k]:Object.assign(body,{by:S.uid,at:new Date().toISOString()})}});else await S.db.doc('cust/all').set({list:{[k]:body}});toast('Added '+n);closeDrawer()}}catch(e){toast(dbErr(e))}},ck?'Save':'Add customer')}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(!f)return;if(el.tagName==='A')e.preventDefault();f(el,e)});
document.addEventListener('keydown',e=>{
  if(e.altKey&&!e.ctrlKey&&(e.key==='d'||e.key==='D'||e.key==='m'||e.key==='M')&&canEnter()){e.preventDefault();A.quick({dataset:{v:/d/i.test(e.key)?'DC':'MT'}});return}
  if(e.key==='Escape'&&S.drawer)closeDrawer();
  if(e.key==='Enter'){const tr=e.target.closest&&e.target.closest('tr.click');if(tr){const f=A[tr.dataset.act];f&&f(tr)}}});

/* phone: swipe an entry card left to show its buttons, right (or tap elsewhere) to hide */
(()=>{let x0=null,y0=null,card=null;
  document.addEventListener('touchstart',e=>{const c=e.target.closest&&e.target.closest('.entry-card');if(!c){$$('.entry-card.swiped').forEach(k=>k.classList.remove('swiped'));return}card=c;x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  document.addEventListener('touchend',e=>{if(!card||x0==null)return;const t=e.changedTouches[0];const dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0){$$('.entry-card.swiped').forEach(k=>{if(k!==card)k.classList.remove('swiped')});card.classList.add('swiped')}else card.classList.remove('swiped')}
    x0=null;card=null},{passive:true});
  document.addEventListener('click',e=>{const m=e.target.closest&&e.target.closest('.swipe-more');if(m){const c=m.closest('.entry-card');c&&c.classList.toggle('swiped')}});
})();
/* PC keyboard: F2 new DC, F3 new MT, Ctrl+K (or F4) search, F6 customers, F7 cylinders, F8 follow-up */
document.addEventListener('keydown',e=>{
  if(e.key==='F2'||e.key==='F3'){if(!canEnter())return;e.preventDefault();A.quick({dataset:{v:e.key==='F2'?'DC':'MT'}});return}
  if((e.ctrlKey&&(e.key==='k'||e.key==='K'))||e.key==='F4'){e.preventDefault();const g=$('#gq');if(g&&g.offsetParent){g.focus();g.select()}else A.gsearch();return}
  const nav={F6:'cust',F7:'cyl',F8:'fu'}[e.key];if(nav&&navOk(nav)){e.preventDefault();go(nav)}});
/* ---------------- boot ---------------- */
async function boot(){
  ['app','drawer-root','toast-root'].forEach(id=>trObs.observe(document.getElementById(id),{childList:true,subtree:true}));
  if(LANG==='ta')document.documentElement.lang='ta';
  refresh();
  const C=window.FBC;
  if(!C||!C.use){S.db=null;Object.keys(S.loaded).forEach(k=>S.loaded[k]=true);refresh();return}
  const [db,user,dl]=await Promise.all([C.use('db'),C.use('user'),C.use('downloads')]);
  S.db=db;S.user=user;S.dl=dl;
  if(!db){Object.keys(S.loaded).forEach(k=>S.loaded[k]=true);refresh();return}
  if(user){try{S.me=await user.me();S.uid=S.me.id;S.isOwner=!!S.me.isOwner}catch(e){}}
  if(S.isOwner)S.readOnly=false;
  bootData();registerMember();watchMembers();
  paintShell();
}
if(window.__TEST)window.__T={NAV,VIEWS,go,openDrawer,closeDrawer,BK,bkRun,S,dcPdf,saveLoc,rentLines,parseTests,fuMessage,openRent,runReport,noCheck,gaps,words,setLang};
boot();
})();
