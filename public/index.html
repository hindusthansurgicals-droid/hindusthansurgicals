<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cylinder Desk</title>
<meta name="theme-color" content="#0E6B5A"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Cylinder Desk"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: operations desk — fixed left rail of sections, a working surface on the right; on phones the rail becomes a scrolling tab strip under the header. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEB; --line:#D3DCD8;
  --ink:#13201C; --muted:#5A6A65; --accent:#0E6B5A; --accent-2:#0A5143; --on-accent:#FFFFFF;
  --ok:#2C7A3A; --ok-bg:#E3F1E5; --warn:#A8670B; --warn-bg:#FBEFD9; --crit:#B3261E; --crit-bg:#FBE4E1; --info:#1F5B8E; --info-bg:#E2ECF6;
  --gas-o2:#2F6FB0; --gas-co2:#6B7280; --gas-n2:#3C3F46; --gas-ar:#0E8A8A; --gas-duro:#8A5A18;
  --shadow:0 1px 2px rgba(19,32,28,.06),0 8px 24px rgba(19,32,28,.08);
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --line:#2A3631;
  --ink:#E3EBE7; --muted:#93A39D; --accent:#4CB89D; --accent-2:#6FCDB5; --on-accent:#08201A;
  --ok:#6CC27A; --ok-bg:#16301C; --warn:#E3AA4F; --warn-bg:#33270F; --crit:#F2766B; --crit-bg:#3A1714; --info:#7FB2E0; --info-bg:#132637;
  --gas-o2:#6FA5DB; --gas-co2:#A3A9B3; --gas-n2:#C3C6CC; --gas-ar:#45C2C2; --gas-duro:#D09A52;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --line:#2A3631;
  --ink:#E3EBE7; --muted:#93A39D; --accent:#4CB89D; --accent-2:#6FCDB5; --on-accent:#08201A;
  --ok:#6CC27A; --ok-bg:#16301C; --warn:#E3AA4F; --warn-bg:#33270F; --crit:#F2766B; --crit-bg:#3A1714; --info:#7FB2E0; --info-bg:#132637;
  --gas-o2:#6FA5DB; --gas-co2:#A3A9B3; --gas-n2:#C3C6CC; --gas-ar:#45C2C2; --gas-duro:#D09A52;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
#dash-body{display:flex;flex-direction:column;gap:16px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.brand>div{min-width:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-mark svg{width:18px;height:18px}
.brand h1{font:800 16px/1.1 var(--f-display);letter-spacing:.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:500 11px/1.2 var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
@media (max-width:600px){.top-right{gap:6px}.top-right .btn.ghost{padding:5px 6px}}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.who img{width:26px;height:26px;border-radius:50%}
.role-pill{font:600 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.layout{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:calc(100% - 52px)}
.rail{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(52px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 52px)}
.rail button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.rail button svg{width:18px;height:18px;flex:none}
.rail button:hover{background:var(--surface-2);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--surface);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line)}
.rail .badge{margin-left:auto}
.rail-foot{margin-top:auto;padding:10px;font-size:11.5px;color:var(--muted)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:calc(51px + env(safe-area-inset-top,0px));z-index:15;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);background:var(--bg);padding:6px max(10px,env(safe-area-inset-left,0px));gap:4px;scrollbar-width:none}
  .rail button{white-space:nowrap;padding:7px 10px}
  .rail-foot{display:none}
  .who span{display:none}
  .brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
}

/* type */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.page-head h2{font:800 24px/1.1 var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.005em}
.page-head p{margin:4px 0 0;color:var(--muted)}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
h3{font:700 15px/1.2 var(--f-display);margin:0;letter-spacing:.01em}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-head .muted{margin-left:auto;font-size:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stat{padding:14px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.stat:first-child{border-left:0}
.stat b{font:800 28px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
@media (max-width:1000px) and (min-width:701px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat:nth-child(4){border-left:0}.stat:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{border-left:0;border-top:1px solid var(--line)}.stat:nth-child(-n+2){border-top:0}.stat:nth-child(even){border-left:1px solid var(--line)}}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--crit)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:12px;font-weight:600;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:38px}
textarea.inp{min-height:60px;resize:vertical}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1 1 160px}
.search{position:relative;flex:1 1 220px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search .inp{padding-left:32px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface-2);gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* type toggle on entry */
.typepick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:1100px){.typepick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.typepick button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.typepick b{font:800 20px/1 var(--f-display)}
.typepick span{overflow-wrap:anywhere}
.typepick span{font-size:12.5px;color:var(--muted)}
.typepick button[aria-pressed="true"].dc{border-color:var(--info);background:var(--info-bg)}
.typepick button[aria-pressed="true"].dc b{color:var(--info)}
.typepick button[aria-pressed="true"].mt{border-color:var(--ok);background:var(--ok-bg)}
.typepick button[aria-pressed="true"].mt b{color:var(--ok)}
.typepick button[aria-pressed="true"].fs{border-color:var(--warn);background:var(--warn-bg)}
.typepick button[aria-pressed="true"].fs b{color:var(--warn)}
.typepick button[aria-pressed="true"].fr{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.typepick button[aria-pressed="true"].fr b{color:var(--accent)}

/* pills, chips */
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--f-body);padding:4px 8px;border-radius:999px;white-space:nowrap}
.pill.out{background:var(--info-bg);color:var(--info)}
.pill.in{background:var(--ok-bg);color:var(--ok)}
.pill.unused{background:var(--surface-2);color:var(--muted)}
.pill.missing,.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.sold{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.t-dc{color:var(--info);font-weight:700}
.t-mt{color:var(--ok);font-weight:700}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--crit);color:#fff;font:700 11px/20px var(--f-body);text-align:center}
.gas{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.gas::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--gc,var(--muted))}
.cyl{font:600 13px/1 var(--f-mono);letter-spacing:.02em;padding:4px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
button.cyl{cursor:pointer}
button.cyl:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 13.5px/1 var(--f-mono);padding:6px 6px 6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface)}
.chip.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:var(--ok-bg)}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:var(--warn-bg)}
.chip.crit{border-color:color-mix(in srgb,var(--crit) 55%,var(--line));background:var(--crit-bg)}
.chip button{border:0;background:none;padding:0 3px;font-size:15px;line-height:1;color:var(--muted)}
.chip-note{font:500 11.5px/1.2 var(--f-body);color:var(--muted)}
.chip-list{display:flex;flex-direction:column;gap:6px}
.chip-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cylbox{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);min-height:46px}
.cylbox input{border:0;outline:0;background:none;flex:1 1 140px;min-width:120px;font:600 15px var(--f-mono);padding:6px 4px;text-transform:uppercase}
.cylbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.expect{display:flex;flex-wrap:wrap;gap:6px}
.expect button{font:600 13px/1 var(--f-mono);padding:6px 8px;border-radius:7px;border:1px dashed var(--line);background:none}
.expect button:hover{border-style:solid;border-color:var(--ok);color:var(--ok)}
.expect button[disabled]{opacity:.4;text-decoration:line-through}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font:600 11.5px/1.2 var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex;min-width:80px}
.bar i{display:block;height:100%}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 15px var(--f-display);margin-bottom:4px}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:10px;font-size:12.5px;color:var(--muted)}

/* aging strip */
.aging{display:flex;flex-direction:column;gap:9px}
.aging .ar{display:grid;grid-template-columns:96px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.aging .ar .bar{height:12px}

/* timeline */
.trip{display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 10px}
.trip .dot{width:12px;height:12px;border-radius:50%;margin:4px auto 0;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.trip .line{width:2px;background:var(--line);margin:0 auto}
.trip .body{padding-bottom:14px;min-width:0}
.trip .body b{font-weight:600}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,15,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer-head h3{font-size:18px}
.drawer-body{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1}
.drawer-body>*{flex:none}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kv span{font-size:11.5px;color:var(--muted)}
.kv b{font-weight:600;overflow-wrap:anywhere}
@media (max-width:520px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* misc */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:60;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.notice{border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.notice.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink)}
.notice.crit{background:var(--crit-bg);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.notice.info{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.notice svg{width:18px;height:18px;flex:none;margin-top:1px}
.dd{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);z-index:25;max-height:300px;overflow-y:auto}
.dd button{display:flex;width:100%;border:0;background:none;padding:9px 12px;text-align:left;gap:8px;align-items:center}
.dd button[aria-selected="true"],.dd button:hover{background:var(--surface-2)}
.dd .sub{margin-left:auto;font-size:12px;color:var(--muted)}
.datebox{position:relative;display:flex;align-items:center}
.sync-slot{display:flex;gap:6px;align-items:center}
.sync-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font:600 12px var(--f-body);white-space:nowrap;cursor:pointer}
.sync-chip i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.sync-chip svg{width:14px;height:14px}
.sync-chip.ok{color:var(--ok);background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.sync-chip.warn{color:var(--warn);background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.sync-chip.crit{color:var(--crit);background:var(--crit-bg);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
@media (max-width:700px){.sync-chip span{display:none}.sync-chip{padding:6px}.sync-chip.bk:not(.warn){display:none}}
.today-sec{display:flex;flex-direction:column}
.today-sec+.today-sec{margin-top:14px}
.today-h{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--ok-bg);color:var(--ok);font-size:13px}
.today-h svg{width:16px;height:16px}
.today-h a{margin-left:auto;font-size:12px}
.today-sec.bad .today-h{background:var(--warn-bg);color:var(--warn)}
.today-sec.bad .entry-card{border-left:3px solid var(--warn);padding-left:8px}
ul.why{margin:-4px 0 8px 0;padding:6px 10px 6px 28px;background:var(--warn-bg);border-radius:8px;font-size:12.5px;color:var(--ink)}
ul.why li{margin:2px 0}
.date-head{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:17px}
.date-head label{white-space:nowrap;font-size:12px;font-weight:600;color:var(--muted)}
.date-head .yr input{height:18px;line-height:16px}
.date-head .yr{font-size:11.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:4px}
.date-head .yr input{width:52px;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:12px;background:var(--surface);text-align:center}
.date-head .yr.other input{border-color:var(--warn);background:var(--warn-bg);color:var(--warn);font-weight:700}
details.more{border:1px dashed var(--line);border-radius:9px;padding:0 12px}
details.more[open]{border-style:solid;padding-bottom:12px}
details.more summary{cursor:pointer;padding:10px 0;font-weight:600;font-size:13px;color:var(--muted);list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.more summary::before{content:'+';display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--surface-2);color:var(--ink);font-weight:700}
details.more[open] summary::before{content:'–'}
details.more summary::-webkit-details-marker{display:none}
.more-body{display:flex;flex-direction:column;gap:12px}
#f-save:focus-visible,#f-save:focus{outline:3px solid var(--accent);outline-offset:3px}
#f-sum.flash{color:var(--crit);font-weight:700;animation:flash .6s 2}
@keyframes flash{50%{opacity:.3}}
.datebox .inp{padding-right:40px}
.datebox .btn{position:absolute;right:3px;top:50%;transform:translateY(-50%);padding:5px 7px}
.datebox input[type=date]{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none}
.inp.bad{border-color:var(--crit);box-shadow:0 0 0 3px color-mix(in srgb,var(--crit) 15%,transparent)}
#f-date-msg.err{color:var(--crit);font-weight:600}#f-date-msg.warn{color:var(--warn);font-weight:600}
.dd.pick .dd-h{padding:9px 12px;font-weight:600;font-size:13px;border-bottom:1px solid var(--line);background:var(--warn-bg);color:var(--warn)}
.dd.pick button{flex-wrap:wrap}
.dd.pick .pid{font:600 14px var(--f-mono);min-width:64px}
.dd.pick .pbr{font-weight:600}
.dd.pick .pst{width:100%;font-size:12px;color:var(--muted);padding-left:72px}
.dd.pick .best{font:600 10.5px var(--f-body);padding:3px 6px;border-radius:999px;background:var(--ok-bg);color:var(--ok);margin-left:auto}
.rel{position:relative}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted);text-align:center;gap:8px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}}
.list-day{font:700 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px}
.entry-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.entry-card:first-of-type{border-top:0}
.entry-card .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.entry-card .tcol{width:38px;text-align:center;font:800 13px/1 var(--f-display);padding:6px 0;border-radius:6px}
.entry-card .tcol.dc{background:var(--info-bg);color:var(--info)}
.entry-card .tcol.mt{background:var(--ok-bg);color:var(--ok)}
.entry-card .tcol.fs{background:var(--warn-bg);color:var(--warn);font-size:11px}
.entry-card .tcol.fr{background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent);font-size:11px}
.entry-card .del{opacity:.5;text-decoration:line-through}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

  for(const n of list){const t=n.nodeValue;const k=t.trim();if(k&&TA[k]&&!n.__ta){n.nodeValue=t.replace(k,TA[k]);n.__ta=1}}

/* ---------------- derive ---------------- */
let deriveTimer=null;
function scheduleDerive(){if(Object.values(S.loaded).every(Boolean))BK.lastChange=Date.now();clearTimeout(deriveTimer);deriveTimer=setTimeout(()=>{derive();refresh()},60)}
function derive(){
  const today=todayISO();const tm=today.slice(0,7);const soon=addMonths(tm,3);
  const tl={};
  for(const id of Object.keys(S.cyl))tl[id]=[];
  if(S.hist){
    const {meta,chunks}=S.hist;
    for(const ch of chunks){for(const e of ch){
      const id=meta.cyl[e[0]];if(!tl[id])tl[id]=[];
      const nm=e[3]>=0?meta.cust[e[3]]:'';
      tl[id].push({src:'old',t:e[1]?'MT':'DC',d:e[2]>=0?isoFromDay(e[2]):null,ck:nm?slug(nm):'',cn:nm});
    }}
  }
  const moves=[];const recs=[];
  for(const [docId,doc] of Object.entries(S.logs)){
    const rs=doc.recs||{};
    for(const [rid,r] of Object.entries(rs)){
      if(!r||!r.t||!Array.isArray(r.cy))continue;
      const rec=Object.assign({},r,{rid,docId});recs.push(rec);
      if(r.del)continue;
      r.cy.forEach(c=>moves.push({src:'new',t:r.t,d:r.d,at:r.at||'',ck:r.ck||'',cn:r.cn,dc:r.dc,by:r.by,br:r.br,pl:r.pl||'',vh:r.vh||'',dr:r.dr||'',rid,docId,cyl:c,vf:r.vf&&r.vf[c]||null,rm:r.rm||''}));
    }
  }
  moves.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:numCmp(a,b));
  for(const m of moves){if(!tl[m.cyl])tl[m.cyl]=[];tl[m.cyl].push(m)}
  const state={};const mism=[];const holding={};const lastMove={};
  const ST={DC:'out',MT:'empty',FS:'filling',FR:'full'};
  for(const [id,evs] of Object.entries(tl)){
    let prev=null,lastCk='',lastPl='';
    for(const ev of evs){
      if(ev.src==='new'){
        let f=null;const pt=prev?prev.t:null;const pn=prev&&prev.ck?custName(prev.ck):'';
        if(!S.cyl[id])f='Cylinder number not in master list';
        else if(ev.t==='DC'){if(pt==='DC')f='Already with '+pn+' (MT not entered?)';else if(pt==='FS')f='At filling plant (not received back?)'}
        else if(ev.t==='MT'){if(pt!=='DC')f='Already in godown (DC not entered?)';else if(prev.ck!==ev.ck)f='This cylinder was with '+pn}
        else if(ev.t==='FS'){if(pt==='DC')f='With '+pn+' (MT not entered?)';else if(pt==='FS')f='Already at filling'}
        else if(ev.t==='FR'){if(pt==='DC')f='With '+pn+' (MT not entered?)'}
        ev.flag=f;
        if(f)mism.push(Object.assign({id},ev));
      }
      if(ev.ck){lastCk=ev.ck;if(ev.d&&(!lastMove[ev.ck]||ev.d>lastMove[ev.ck]))lastMove[ev.ck]=ev.d}
      if(ev.t==='FS')lastPl=ev.pl||'';
      prev=ev;
    }
    const c=S.cyl[id]||{};
    let st='unused',d=null;
    if(prev){d=prev.d;st=ST[prev.t]||'empty'}
    const ck=st==='out'?prev.ck:lastCk;
    const r=(c.r||'').toUpperCase();
    if(r==='MISSING')st='missing';else if(r==='SOLD')st='sold';
    const days=daysSince(d);
    const td=c.td||'';const tdue=!td?'none':td<tm?'over':td<=soon?'soon':'ok';
    state[id]={id,st,ck,d,days,g:c.g||'?',b:c.b||'',r:c.r||'',known:!!S.cyl[id],n:evs.length,td,tdue,pl:st==='filling'?lastPl:''};
    if(st==='out'){(holding[ck]=holding[ck]||[]).push(state[id])}
  }
  const custMoves={};
  for(const [id,evs] of Object.entries(tl)){for(const ev of evs){if(!ev.ck)continue;(custMoves[ev.ck]=custMoves[ev.ck]||[]).push(Object.assign({id},ev))}}
  for(const k in holding)holding[k].sort((a,b)=>(b.days??-1)-(a.days??-1));
  recs.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:-numCmp(a,b));
  S.D={tl,state,mism,holding,custMoves,recs,lastMove,today};
}

/* ---------------- db wiring ---------------- */
function bootData(){
  const db=S.db;
  const err=e=>{console.warn(e);if(e&&e.code==='revoked'){S.readOnly=true}};
  db.doc('settings/company').onSnapshot(s=>{if(s.exists)S.company=Object.assign({},S.company,s.data());S.loaded.company=true;paintBrand();scheduleDerive()},err);
  db.doc('settings/roles').onSnapshot(s=>{const before=role();S.roles=(s.exists&&s.data().users)||{};if(S.loaded.roles&&!before&&role()){location.reload();return}S.loaded.roles=true;paintShell();scheduleDerive()},err);
  db.doc('cust/all').onSnapshot(s=>{S.custDoc=s.exists;S.cust=(s.exists&&s.data().list)||{};S.loaded.cust=true;scheduleDerive()},err);
  db.collection('bill').onSnapshot(q=>{const m={};q.docs.forEach(d=>{if(!d.id.startsWith('lock_'))m[d.id]=d.data()});S.bill=m;scheduleDerive()},err);
  db.doc('trade/buy').onSnapshot(s=>{S.trade.buy=(s.exists&&s.data().lots)||{};scheduleDerive()},err);
  db.doc('trade/sell').onSnapshot(s=>{S.trade.sell=(s.exists&&s.data().sales)||{};scheduleDerive()},err);
  db.doc('reg/void').onSnapshot(s=>{S.voids=(s.exists&&s.data().list)||{};scheduleDerive()},err);
  db.collection('cyl').onSnapshot(q=>{const m={},src={};q.docs.forEach(d=>{const l=(d.data()||{}).list||{};for(const k in l){m[k]=l[k];src[k]=d.id}});S.cyl=m;S.cylSrc=src;S.loaded.cyl=true;scheduleDerive()},err);
  db.collection('hist').get().then(q=>{
    let meta=null;const ch=[];
    q.docs.forEach(d=>{const v=d.data();if(d.id==='meta')meta=v;else if(Array.isArray(v.ev))ch[v.i]=v.ev});
    S.hist=meta?{meta,chunks:ch.filter(Boolean)}:null;S.loaded.hist=true;scheduleDerive();
  }).catch(e=>{err(e);S.loaded.hist=true;scheduleDerive()});
  // logs: one query per month from Sep 2026 to now; live for the last two months
  const start=new Date(2026,8,1);const now=new Date();const months=[];
  for(let d=new Date(start);d<=now;d.setMonth(d.getMonth()+1))months.push(d.getFullYear()+'-'+pad(d.getMonth()+1));
  let pending=months.length;
  const done=()=>{if(--pending<=0){S.loaded.logs=true}scheduleDerive()};
  months.forEach((m,i)=>{
    const [y,mo]=m.split('-').map(Number);const nx=mo===12?(y+1)+'-01':y+'-'+pad(mo+1);
    const q=db.collection('log').where('date','>=',m+'-01').where('date','<',nx+'-01').limit(1000);
    const apply=snap=>{const keep={};snap.docs.forEach(d=>{keep[d.id]=d.data()});
      for(const k of Object.keys(S.logs)){if(k.slice(0,7)===m&&!(k in keep))delete S.logs[k]}
      Object.assign(S.logs,keep)};
    if(i>=months.length-2){let first=true;q.onSnapshot(s=>{apply(s);if(first){first=false;done()}else scheduleDerive()},e=>{err(e);if(first){first=false;done()}})}
    else q.get().then(s=>{apply(s);done()}).catch(e=>{err(e);done()});
  });
}

function dbErr(e){
  const c=e&&e.code;
  if(c==='quota_exceeded')return 'The database is full. Ask the owner to archive old entries.';
  if(c==='invalid_argument')return 'You do not have permission to save this. Ask the owner for access.';
  if(c==='revoked')return 'Your access was changed. Reload the page.';
  return 'Could not save. Check your connection and try again.';
}

const kv=(()=>{let dbp=null;const open=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('cd-local',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=async(mode,fn)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction('kv',mode);const q=fn(t.objectStore('kv'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
  return {get:k=>tx('readonly',s=>s.get(k)),set:(k,v)=>tx('readwrite',s=>s.put(v,k)),del:k=>tx('readwrite',s=>s.delete(k))}})();

/* why: 'auto' (timer, never asks anything) or 'manual' (a click: may ask for folder permission or download) */
async function bkRun(why){
  if(BK.busy||!window.FBC)return false;BK.busy=true;paintSync();
  try{
    const data=await FBC.backupAll();const text=JSON.stringify(data);const now=new Date();
    const slot=pad(now.getHours())+'-'+(now.getMinutes()<30?'00':'30');let where;
    if(BK.dir&&await bkPerm(why!=='auto')){
      // 48 rolling half-hour files (last 24 hours) + one file per day (kept)
      await bkWrite(`Cylinder desk auto ${slot}.json`,text);await bkWrite(`Cylinder desk daily ${todayISO()}.json`,text);where=BK.dirName;
    }else if(why!=='auto'){bkDownload(`Cylinder desk backup ${todayISO()} ${slot}.json`,text);where='Downloads'}
    else{BK.due=true;return false}
    BK.last=now.toISOString();BK.due=false;try{localStorage.setItem('cd-bk-last',BK.last)}catch(e){}
    if(why!=='auto')toast(T2('Backup saved','Backup சேமிக்கப்பட்டது')+' · '+where);
    return true;
  }catch(e){console.warn(e);toast(T2('Backup failed — check the connection.','Backup தோல்வி — இணையத்தைச் சரிபார்க்கவும்.'));return false}
  finally{BK.busy=false;paintSync();if(S.drawer&&S.drawer.sync)paintDrawer()}
}

/* Typed dates: 24-9-26 · 24/09/2026 · 24.9.26 · 240926 · 24092026 · 24-9 (this year) → ISO, or null */
function parseTypedDate(v,defYear){
  let s=String(v||'').trim();if(!s)return null;let d,m,y;
  const now=new Date();let x;const Y=+defYear||now.getFullYear();
  if((x=/^(\d{1,2})\D+(\d{1,2})\D+(\d{2}|\d{4})$/.exec(s))){d=+x[1];m=+x[2];y=+x[3]}
  else if((x=/^(\d{1,2})\D+(\d{1,2})$/.exec(s))){d=+x[1];m=+x[2];y=Y}
  else if((x=/^(\d{2})(\d{2})$/.exec(s))){d=+x[1];m=+x[2];y=Y}
  else if((x=/^(\d{2})(\d{2})(\d{2}|\d{4})$/.exec(s))){d=+x[1];m=+x[2];y=+x[3]}
  else if((x=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s))){y=+x[1];m=+x[2];d=+x[3]}
  else return null;
  if(y<100)y+=2000;if(m<1||m>12||d<1||d>31||y<2000||y>2100)return null;
  const iso=y+'-'+pad(m)+'-'+pad(d);const t=new Date(Date.UTC(y,m-1,d));
  return t.getUTCDate()===d&&t.getUTCMonth()===m-1?iso:null;
}

function chipStatus(id,f){
  const st=S.D.state[id];
  if(!st||!st.known)return ['crit','Not in cylinder list'];
  if(st.st==='missing')return ['warn','Marked missing'];
  if(st.st==='sold')return ['warn','Marked sold'];
  const where=st.st==='out'?'With '+custName(st.ck)+' since '+fmtD(st.d):st.st==='filling'?'At filling'+(st.pl?' ('+st.pl+')':''):'';
  if(f.t==='DC'){
    if(st.st==='out'||st.st==='filling')return ['warn','Already '+where.charAt(0).toLowerCase()+where.slice(1)];
    if(st.tdue==='over')return ['warn','Hydro-test overdue ('+fmtM(st.td)+')'];
    if(S.company.trackFill&&st.st==='empty')return ['warn','Empty in godown, not marked full'];
    return ['ok',st.st==='full'?'Full in godown':st.st==='empty'?'In godown':'First use']}
  if(f.t==='MT'){
    if(st.st!=='out')return ['warn','Already '+(st.st==='filling'?'at filling':'in godown')];
    if(f.ck&&st.ck!==f.ck)return ['warn','Was with '+custName(st.ck)];
    return ['ok','With this customer '+(st.days!=null?st.days+' days':'')]}
  if(f.t==='FS'){
    if(st.st==='out')return ['warn',where+' (MT not entered?)'];
    if(st.st==='filling')return ['warn','Already at filling'];
    if(st.tdue==='over')return ['warn','Hydro-test overdue ('+fmtM(st.td)+')'];
    return ['ok',st.st==='full'?'Already full':'Empty in godown']}
  if(f.t==='FR'){
    if(st.st==='out')return ['warn',where+' (MT not entered?)'];
    return ['ok',st.st==='filling'?'Coming back from filling':'Marked full']}
  return ['ok',''];
}

      const n=dd.querySelectorAll('button').length;if(dd.hidden||!n)return;
      if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(n-1,sel+1);showDD()}
      else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);showDD()}
      else if(e.key==='Enter'||(e.key==='Tab'&&!e.shiftKey)){e.preventDefault();const b=dd.querySelectorAll('button')[Math.max(sel,0)];b&&b.dispatchEvent(new MouseEvent('mousedown',{bubbles:true}))}
    });
    dd.addEventListener('mousedown',async e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();
      if(b.dataset.ck)pick(b.dataset.ck);
      else if(b.dataset.new){const ck=await addCustomer(ci.value.trim());if(ck)pick(ck)}});
    const cyIn=$('#f-cyl');
    /* Same number used for more than one cylinder (1014 Dharmapuri / K1014 Krishnagiri, 1002 O2 / C1002 CO2):
       typing just the number asks which one, best match first. */
    const twins=tok=>{const m=/^(\d+)$/.exec(tok);if(!m)return null;
      const c=Object.keys(S.cyl).filter(k=>{const x=/^([A-Z]*)(\d+)(-\d+)?$/.exec(k);return x&&x[2]===m[1]});
      if(!c.length||(c.length===1&&c[0]===tok))return null;return c};
    const pickScore=id=>{const c=S.cyl[id]||{},st=S.D.state[id]||{};let s=0;
      if(c.b&&c.b===f.br)s+=2;
      if(f.t==='DC'&&(st.st==='empty'||st.st==='full'||st.st==='unused'))s+=3;
      if(f.t==='MT'&&st.st==='out'){s+=1;if(f.ck&&st.ck===f.ck)s+=5}
      if(f.t==='FS'&&st.st==='empty')s+=3;if(f.t==='FR'&&st.st==='filling')s+=3;
      if(st.st==='sold'||st.st==='missing')s-=5;return s};
    const pend=[];let psel=0;const pdd=$('#f-cyl-dd');
    /* Tab from the cylinder box jumps to Save entry (Enter there saves). If something is missing, the reason is shown. */
    const toSave=()=>{if(!dIn.value.trim()||!f.d){if(!readDate()){dIn.focus();return}}VIEWS.entry.updateSave();const b=$('#f-save');
      if(b&&!b.disabled){b.focus();return}
      const sum=$('#f-sum');if(sum){sum.classList.remove('flash');void sum.offsetWidth;sum.classList.add('flash')}
      if(isCust(f.t)&&!f.ck)$('#f-cust').focus();else if(!isCust(f.t)&&!f.pl.trim())$('#f-pl').focus();else cyIn.focus()};
    const showPick=()=>{
      if(!pend.length){pdd.hidden=true;pdd.innerHTML='';cyIn.setAttribute('aria-expanded','false');return}
      const {tok,list}=pend[0];const ta=LANG==='ta';
      pdd.innerHTML=`<div class="dd-h">${ta?`“${esc(tok)}” என்ற எண்ணில் ${list.length} சிலிண்டர்கள் உள்ளன — எது?`:`${list.length} cylinders have the number “${esc(tok)}” — which one?`}</div>`+
        list.map((id,i)=>{const c=S.cyl[id]||{},st=S.D.state[id]||{};
          const where=st.st==='out'?(ta?'வாடிக்கையாளரிடம்: ':'With ')+custName(st.ck)+(st.d?' · '+fmtD(st.d):''):st.st==='filling'?(ta?'நிரப்ப சென்றது':'At filling'):st.st==='missing'?(ta?'காணவில்லை':'Missing'):st.st==='sold'?(ta?'விற்றது':'Sold'):st.st==='full'?(ta?'குடோன் · நிரம்பியது':'Godown · full'):st.st==='empty'?(ta?'குடோன் · காலி':'Godown · empty'):(ta?'இன்னும் பயன்படுத்தவில்லை':'Not used yet');
          return `<button type="button" role="option" data-pick="${esc(id)}" aria-selected="${i===psel}"><span class="pid">${esc(id)}</span><span class="pbr">${esc(c.g||'')}${c.b?' · '+esc(brName(c.b)):''}</span>${i===0&&list.length>1&&pickScore(list[0])>pickScore(list[1])?`<span class="best">${ta?'பொருத்தமானது':'Best match'}</span>`:''}<span class="pst">${esc(where)}</span></button>`}).join('');
      pdd.hidden=false;cyIn.setAttribute('aria-expanded','true');
    };
    const choose=id=>{pend.shift();psel=0;if(id&&!f.cy.includes(id))f.cy.push(id);f.confirm=false;this.update();showPick();cyIn.focus()};
    pdd.addEventListener('mousedown',e=>{const b=e.target.closest('[data-pick]');if(!b)return;e.preventDefault();choose(b.dataset.pick)});
    const addFrom=txt=>{txt.split(/[\s,;]+/).map(normCyl).filter(Boolean).forEach(id=>{
        const tw=twins(id);
        if(tw){pend.push({tok:id,list:tw.sort((a,b)=>pickScore(b)-pickScore(a)||a.localeCompare(b))});return}
        if(!f.cy.includes(id))f.cy.push(id)});
      f.confirm=false;this.update();psel=0;showPick()};
    cyIn.addEventListener('keydown',e=>{
      if(pend.length&&!cyIn.value.trim()){const n=pend[0].list.length;
        if(e.key==='ArrowDown'){e.preventDefault();psel=Math.min(n-1,psel+1);showPick();return}
        if(e.key==='ArrowUp'){e.preventDefault();psel=Math.max(0,psel-1);showPick();return}
        if(e.key==='Enter'){e.preventDefault();choose(pend[0].list[psel]);return}
        if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();choose(pend[0].list[psel]);if(!pend.length)toSave();return}
        if(e.key==='Escape'){e.preventDefault();e.stopPropagation();choose(null);return}}
      if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();if(cyIn.value.trim()){addFrom(cyIn.value);cyIn.value=''}if(!pend.length)toSave();return}
      if(e.key==='Enter'||e.key===','||e.key===' '){e.preventDefault();if(cyIn.value.trim()){addFrom(cyIn.value);cyIn.value=''}}
      else if(e.key==='Backspace'&&!cyIn.value&&f.cy.length){f.cy.pop();this.update()}
    });
    cyIn.addEventListener('paste',e=>{const t=(e.clipboardData||window.clipboardData).getData('text');if(t&&/[\s,;]/.test(t.trim())){e.preventDefault();addFrom(t)}});
    cyIn.addEventListener('blur',()=>{if(cyIn.value.trim()){addFrom(cyIn.value);cyIn.value=''}});
    $('#f-cylbox').addEventListener('click',e=>{if(e.target.id==='f-cylbox'||e.target.id==='f-chips')cyIn.focus()});
    this.update();
  },
  update(){
    const f=S.form;if(!f||!$('#entry-form'))return;
    $$('.typepick button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===f.t)));

    const info=$('#f-cust-info');
    if(f.ck){const h=S.D.holding[f.ck]||[];const c=S.cust[f.ck]||{};const o=h.filter(x=>x.days>90).length;info.innerHTML=`${esc(c.t||'')}${c.ph?' · '+esc(c.ph):''} · holding <b class="num">${h.length}</b> cylinder${h.length===1?'':'s'}${o?` · <span class="pill crit">${o} over 90 days</span>`:''} · <a href="#" data-act="opencust" data-v="${esc(f.ck)}" tabindex="-1">${LANG==='ta'?'நிலுவை & வரலாறு':'Outstanding & history'}</a>`}
    else info.textContent=f.cq?'Pick a customer from the list, or add a new one.':'';
    $('#f-chips').innerHTML=f.cy.map((id,i)=>{const [k,msg]=chipStatus(id,f);const st=S.D.state[id];return `<span class="chip ${k}" title="${esc(msg)}">${esc(id)}${st&&st.known?`<span class="chip-note">${esc(st.g)}</span>`:''}<button type="button" data-act="rmchip" data-i="${i}" aria-label="Remove ${esc(id)}">×</button></span>`}).join('');
    const probs=f.cy.map(id=>[id,...chipStatus(id,f)]).filter(x=>x[1]!=='ok');
    $('#f-cyl-help').innerHTML=f.cy.length?`${f.cy.length} cylinder${f.cy.length===1?'':'s'}${probs.length?` · <span style="color:var(--warn);font-weight:600">${probs.length} to check</span>`:' · all look right'}${f.cy.length>1?` · <a href="#" data-act="clearchips">clear all</a>`:''}`:'Type a number and press Enter for the next one. When done, press Tab and then Enter to save.';
    const ex=$('#f-expect');let list=null,label='';
    if(f.t==='MT'&&f.ck){list=S.D.holding[f.ck]||[];label='Cylinders with '+custName(f.ck)+' now';
      if(!list.length){ex.innerHTML=`<div class="notice info">${ic('info')}<div>Our records show no cylinders with this customer. If they returned one, it will be flagged for checking.</div></div>`;list=null}}
    else if(f.t==='FS'){list=Object.values(S.D.state).filter(s=>s.known&&s.st==='empty'&&(!s.b||s.b===f.br)).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));label='Empty in godown ('+brName(f.br)+')'}
    else if(f.t==='FR'){list=Object.values(S.D.state).filter(s=>s.known&&s.st==='filling'&&(!f.pl||!s.pl||s.pl.toLowerCase()===f.pl.trim().toLowerCase())).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));label='At filling'+(f.pl?' · '+f.pl:'')}
    if(list){const left=list.filter(s=>!f.cy.includes(s.id));
      ex.innerHTML=list.length?`<div class="field"><label>${esc(label)} · tap to add${left.length>1?` · <a href="#" data-act="addall">add all ${left.length}</a>`:''}</label><div class="expect">${list.slice(0,120).map(s=>`<button type="button" data-act="addexp" data-v="${esc(s.id)}" ${f.cy.includes(s.id)?'disabled':''} title="Since ${fmtD(s.d)}">${esc(s.id)} <span class="muted" style="font-family:var(--f-body);font-weight:500">${s.days!=null?s.days+'d':''}</span></button>`).join('')}${list.length>120?`<span class="small muted">+${list.length-120} more</span>`:''}</div></div>`:`<div class="small muted">${esc(label)}: none.</div>`}
    else if(!(f.t==='MT'&&f.ck))ex.innerHTML='';
    $('#f-warn').innerHTML=probs.length?`<div class="notice warn">${ic('warn')}<div style="display:flex;flex-direction:column;gap:6px"><b>Check before saving</b>${probs.slice(0,30).map(p=>`<div><span class="cyl">${esc(p[0])}</span> ${esc(p[2])}</div>`).join('')}${probs.length>30?`<div class="small muted">+${probs.length-30} more</div>`:''}
      <label class="check"><input type="checkbox" id="f-confirm" ${f.confirm?'checked':''}> Save anyway. These go to Mismatches for the office to check.</label></div></div>`:'';
    const cb=$('#f-confirm');if(cb)cb.addEventListener('change',e=>{f.confirm=e.target.checked;VIEWS.entry.updateSave()});
    this.updateNo();
    const sv=null;
    $('#f-saved').innerHTML=sv?`<div class="notice info">${ic('check')}<div style="flex:1"><b>Saved.</b> ${esc(TLABEL[sv.t])} ${esc(sv.dc?'#'+sv.dc:'')} · ${esc(sv.title)} · ${sv.cy.length} cylinder${sv.cy.length===1?'':'s'}
      ${sv.t==='DC'?`<div style="margin-top:8px"><button type="button" class="btn sm" data-act="dcpdf" data-doc="${esc(sv.docId)}" data-rid="${esc(sv.rid)}">${ic('dl')}Download DC (PDF)</button></div>`:''}</div></div>`:'';
    const madeToday=r=>r.at?todayISO.call(null)===(()=>{const d=new Date(r.at);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())})():r.d===S.D.today;
    const mine=S.D.recs.filter(r=>!r.del&&madeToday(r)).sort((a,b)=>(b.at||'').localeCompare(a.at||''));
    $('#f-today-n').textContent=mine.length?`${mine.reduce((a,r)=>a+r.cy.length,0)} cylinders in ${mine.length} entries`:'';
    const why=r=>r.cy.map(c=>{const ev=(S.D.tl[c]||[]).find(e=>e.rid===r.rid&&e.cyl===c);return ev&&ev.flag&&!ev.vf?{c,f:ev.flag}:null}).filter(Boolean);
    const bad=mine.filter(r=>why(r).length),good=mine.filter(r=>!why(r).length);
    $('#f-today').innerHTML=mine.length?
      (bad.length?`<div class="today-sec bad"><div class="today-h">${ic('warn')}<b>${LANG==='ta'?'சரிபார்க்க':'To check'} · ${bad.length}</b><a href="#" data-act="nav" data-v="mism">All mismatches</a></div>${bad.map(r=>entryCard(r)+`<ul class="why">${why(r).map(x=>`<li><span class="mono">${esc(x.c)}</span> ${esc(x.f)}</li>`).join('')}</ul>`).join('')}</div>`:'')+
      (good.length?`<div class="today-sec"><div class="today-h">${ic('check')}<b>${LANG==='ta'?'சரியானவை':'OK'} · ${good.length}</b></div>${good.map(r=>entryCard(r)).join('')}</div>`:'')
      :`<div class="empty"><b>Nothing yet today</b>Every entry made today, by anyone, appears here.</div>`;
  },
  updateSave(){const f=S.form;const probs=f.cy.filter(id=>chipStatus(id,f)[0]!=='ok').length;const hard=f.cy.some(id=>chipStatus(id,f)[0]==='crit');
    const who=isCust(f.t)?!!f.ck:!!f.pl.trim();
    const nc=noCheck(f);const dup=!!(nc&&nc.k==='crit');const ok=who&&f.cy.length&&f.d&&!f.busy&&(!probs||f.confirm)&&!hard&&!dup;
    const b=$('#f-save');if(b)b.disabled=!ok;
    const sum=$('#f-sum');if(sum)sum.textContent=!f.d?'Check the date':dup?'This number is already used':!who?(isCust(f.t)?'Choose a customer':'Type the filling plant or supplier'):!f.cy.length?'Add at least one cylinder':hard?'Remove numbers that are not in the list':probs&&!f.confirm?'Tick “Save anyway” to continue':''}
};
async function addCustomer(name){
  name=name.replace(/\s+/g,' ').trim();if(!name)return null;
  const ck=slug(name);if(!ck)return null;
  if(S.cust[ck])return ck;
  const t=/\bhos|clinic|scan|dental\b/i.test(name)?'Hospital':/\beng\b/i.test(name)?'Engineering':/\bind\b/i.test(name)?'Industry':'Other';
  try{const ref=S.db.doc('cust/all');const body={n:name,t,ph:'',ad:'',by:S.uid,at:new Date().toISOString()};
    if(S.custDoc)await ref.update({list:{[ck]:body}});else await ref.set({list:{[ck]:body}});
    S.cust[ck]=body;toast('Added customer '+name);return ck}catch(e){toast(dbErr(e));return null}
}
async function saveEntry(){
  const f=S.form;if(f.busy)return;
  const cust=isCust(f.t);
  if((cust&&!f.ck)||(!cust&&!f.pl.trim())||!f.cy.length)return;
  f.busy=true;VIEWS.entry.updateSave();
  const now=new Date().toISOString();
  const body={t:f.t,d:f.d,ck:cust?f.ck:'',cn:cust?custName(f.ck):'',pl:cust?'':f.pl.trim(),dc:f.dc||'',cy:f.cy.slice(),rm:f.rm||'',vh:(f.vh||'').trim(),dr:(f.dr||'').trim(),br:f.br,by:S.uid,at:now};
  try{
    if(f.edit){
      body.by=f.edit.by;body.at=f.edit.at;body.ed={by:S.uid,at:now};
      const sameDoc=f.edit.docId.startsWith(f.d+'_'+f.br+'_');
      if(sameDoc)await S.db.doc('log/'+f.edit.docId).update({recs:{[f.edit.rid]:body}});
      else{await patchRec(f.edit.docId,f.edit.rid,{del:{by:S.uid,at:now,moved:true}});await writeRec({rid:f.edit.rid,body},f.d,f.br)}
      toast('Changes saved');S.form=newForm();mounted=null;refresh();return;
    }
    const rid=uidGen();
    await writeRec({rid,body},f.d,f.br);
    const keep={t:f.t,d:todayISO(),br:f.br,vh:f.vh,dr:f.dr,pl:cust?'':f.pl};
    S.form=Object.assign(newForm(),keep,{saved:{t:body.t,dc:body.dc,title:recTitle(body),cy:body.cy,rid,docId:f.d+'_'+f.br+'_'+S.uid}});
    if(isCust(S.form.t)){const nn=Math.max(+nextNo(S.form.t,S.form.br)||0,isNum(body.dc)&&body.t===S.form.t?+body.dc+1:0);S.form.dc=nn?String(nn):'';S.form.dcAuto=!!nn}
    toast((LANG==='ta'?'சேமிக்கப்பட்டது: ':'Saved: ')+TLABEL[body.t]+(body.dc?' #'+body.dc:'')+' · '+recTitle(body)+' · '+body.cy.length+(LANG==='ta'?' சிலிண்டர்':' cylinder'+(body.cy.length===1?'':'s')));
    mounted=null;refresh();setTimeout(()=>{const c=$(cust?'#f-cust':'#f-cyl');c&&c.focus()},50);
  }catch(e){f.busy=false;toast(dbErr(e),4500);VIEWS.entry.updateSave()}
}
function canEditRec(r){if(!canEnter())return false;if(canManage())return true;return r.by===S.uid&&r.d===S.D.today}
function entryCard(r){
  const flags=r.cy.filter(c=>{const ev=(S.D.tl[c]||[]).find(e=>e.rid===r.rid&&e.cyl===c);return ev&&ev.flag&&!ev.vf});
  return `<div class="entry-card ${r.del?'del':''}"><div class="tcol ${r.t.toLowerCase()}">${TSHORT[r.t]}</div>
  <div style="min-width:0;display:flex;flex-direction:column;gap:6px"><div><b>${esc(recTitle(r))}</b> ${r.dc?`<span class="muted mono small">#${esc(r.dc)}</span>`:''}</div>
  <div class="chips">${r.cy.map(c=>`<button class="cyl" data-act="opencyl" data-v="${esc(c)}" ${flags.includes(c)?'style="border-color:var(--warn);background:var(--warn-bg)"':''}>${esc(c)}</button>`).join('')}</div>
  <div class="meta"><span>${fmtD(r.d)} · ${esc(brName(r.br))}</span><span data-name="${esc(r.by)}">${esc(personName(r.by))}</span><span>${fmtDT(r.at)}</span>${r.vh?`<span class="mono">${esc(r.vh)}</span>`:''}${r.dr?`<span>Driver ${esc(r.dr)}</span>`:''}${r.ed?'<span>edited</span>':''}${r.rm?`<span>${esc(r.rm)}</span>`:''}${r.del?'<span>deleted</span>':''}</div></div>
  <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${!r.del&&r.t==='DC'?`<button class="btn sm ghost" data-act="dcpdf" data-doc="${esc(r.docId)}" data-rid="${esc(r.rid)}" title="Download DC">${ic('dl')}</button>`:''}${!r.del&&canEditRec(r)?`<button class="btn sm ghost" data-act="editrec" data-doc="${esc(r.docId)}" data-rid="${esc(r.rid)}" title="Edit">${ic('edit')}</button><button class="btn sm ghost danger" data-act="delrec" data-doc="${esc(r.docId)}" data-rid="${esc(r.rid)}" title="Delete">${ic('x')}</button>`:''}</div></div>`;
}

VIEWS.entry.updateNo=function(){const f=S.form;const el=$('#f-no-info');if(!f||!el)return;const c=noCheck(f);

async function createInvoice(){
  const u=S.ui;const V=VIEWS.bill;const {rs,lines}=V.lines();if(!rs.length)return;
  const gst=+$('#bn-gst').value||0,d=$('#bn-date').value||todayISO(),br=$('#bn-br').value;const ck=u.bnCust;
  const taxable=Math.round(lines.reduce((s,l)=>s+l.q*l.rate,0)*100)/100;const tax=Math.round(taxable*gst)/100;const total=Math.round((taxable+tax)*100)/100;
  $('#bn-save').disabled=true;
  try{
    const lock=S.db.doc('bill/lock_'+br);let got=false;
    for(let i=0;i<6&&!got;i++){const r=await lock.acquire({holder:S.uid||'x',ttlMs:8000});got=r.acquired;if(!got)await new Promise(z=>setTimeout(z,900))}
    if(!got){toast('Another invoice is being created. Try again in a few seconds.');$('#bn-save').disabled=false;return}
    let mx=0;invoices().forEach(v=>{if(v.br===br&&v.no>mx)mx=v.no});const no=mx+1;
    const id=uidGen();const docId=d.slice(0,7)+'_'+br;const ref=S.db.doc('bill/'+docId);
    const inv={no,pre:billCfg().prefix,br,d,ck,cn:custName(ck),gstin:(S.cust[ck]||{}).gst||'',lines:lines.map(l=>({g:l.g,q:l.q,rate:l.rate,hsn:l.hsn})),gst,taxable,tax,total,dcs:rs.map(r=>[r.docId,r.rid,r.dc||'']),by:S.uid,at:new Date().toISOString()};
    const s=await ref.get();if(s.exists)await ref.update({inv:{[id]:inv}});else await ref.set({month:d.slice(0,7),br,inv:{[id]:inv}});
    S.bill[docId]=S.bill[docId]||{inv:{}};S.bill[docId].inv=Object.assign({},S.bill[docId].inv,{[id]:inv});
    toast('Invoice '+invNo(inv)+' created');u.bnCust='';u.bnSel=null;V._rates=null;V._tab=null;
    formDrawer('Invoice '+invNo(inv),`<p>${esc(custName(ck))} · ₹${fmtAmt(total)} · ${rs.length} DC</p>`,async()=>{await invoicePdf(docId,id);closeDrawer()},'Download PDF');
    V.update();
  }catch(e){toast(dbErr(e));$('#bn-save').disabled=false}
}
async function invoicePdf(docId,id){
  const v=S.bill[docId]&&S.bill[docId].inv[id];if(!v){toast('Invoice not found');return}
  try{await loadScript(JSPDF_SRC)}catch(e){toast('Could not load the PDF tool. Check your connection.');return}
  const {jsPDF}=window.jspdf;const p=new jsPDF({unit:'mm',format:'a4'});const W=210;const co=S.company;const c=S.cust[v.ck]||{};
  p.setFont('helvetica','bold');p.setFontSize(16);p.text(co.name||'',W/2,18,{align:'center'});p.setFont('helvetica','normal');p.setFontSize(9);let y=23;
  (co.addr||'').split(/\n/).forEach(l=>{p.text(l,W/2,y,{align:'center'});y+=4.5});
  const l2=[co.phone?'Ph: '+co.phone:'',co.gst?'GSTIN: '+co.gst:''].filter(Boolean).join('   ');if(l2){p.text(l2,W/2,y,{align:'center'});y+=4.5}
  y+=2;p.line(14,y,W-14,y);y+=8;p.setFont('helvetica','bold');p.setFontSize(13);p.text(v.cancel?'TAX INVOICE (CANCELLED)':'TAX INVOICE',W/2,y,{align:'center'});y+=9;
  p.setFontSize(10);p.text('Invoice No: '+invNo(v),14,y);p.text('Date: '+fmtD(v.d),W-14,y,{align:'right'});y+=7;
  p.text('Bill to:',14,y);p.setFont('helvetica','normal');p.text(custName(v.ck),34,y);y+=5;
  if(c.ad){p.splitTextToSize(c.ad,120).forEach(l=>{p.text(l,34,y);y+=4.5})}
  if(c.ph){p.text('Ph: '+c.ph,34,y);y+=4.5}if(v.gstin||c.gst){p.text('GSTIN: '+(v.gstin||c.gst),34,y);y+=4.5}
  y+=4;const X=[14,26,96,124,146,172];p.setFillColor(230,236,233);p.rect(14,y,W-28,8,'F');p.setFont('helvetica','bold');
  ['S.No','Description','HSN','Qty','Rate','Amount'].forEach((h,i)=>p.text(h,i>=3?X[i]+(i===5?22:16):X[i]+1,y+5.5,i>=3?{align:'right'}:undefined));y+=8;p.setFont('helvetica','normal');
  v.lines.forEach((l,i)=>{p.text(String(i+1),X[0]+1,y+5.5);p.text(l.g+' gas refill',X[1]+1,y+5.5);p.text(l.hsn||'',X[2]+1,y+5.5);p.text(String(l.q),X[3]+16,y+5.5,{align:'right'});p.text(fmtAmt(l.rate),X[4]+16,y+5.5,{align:'right'});p.text(fmtAmt(l.q*l.rate),X[5]+22,y+5.5,{align:'right'});y+=8;p.setDrawColor(210);p.line(14,y,W-14,y)});
  y+=6;const R=(lab,val,b)=>{p.setFont('helvetica',b?'bold':'normal');p.text(lab,150,y,{align:'right'});p.text(val,W-14,y,{align:'right'});y+=6};
  R('Taxable value',fmtAmt(v.taxable));if(v.gst){R('CGST @ '+v.gst/2+'%',fmtAmt(v.tax/2));R('SGST @ '+v.gst/2+'%',fmtAmt(v.tax/2))}R('Total (Rs.)',fmtAmt(v.total),true);
  y+=2;p.setFont('helvetica','normal');p.setFontSize(9);p.text('Rupees '+words(v.total)+' only',14,y);y+=6;
  p.text('Against DC: '+(v.dcs||[]).map(x=>x[2]||'-').join(', '),14,y,{maxWidth:W-28});y+=12;
  y=Math.max(y,250);p.line(W-70,y,W-14,y);p.text('For '+(co.name||''),W-14,y+5,{align:'right'});p.text('Authorised signatory',W-14,y+10,{align:'right'});
  await saveFile(`Invoice ${invNo(v).replace(/\//g,'-')} ${custName(v.ck)}.pdf`,p.output('arraybuffer'));
}

VIEWS.ana={
  mount(){return `<div class="page-head"><div><h2>Analysis</h2><p>How cylinders move: monthly volume, how long customers keep them, and who is holding more than they use.</p></div></div>
    <div class="panel"><div class="panel-head"><h3>Monthly movement</h3><span class="muted">last 12 months · <span class="t-dc">■</span> DC out <span class="t-mt">■</span> MT in</span></div><div id="an-chart" style="overflow-x:auto"></div></div>
    <div class="panel"><div class="panel-head"><h3>Customers: usage and extra cylinders</h3><span class="muted">based on the last 90 days</span></div>
    <div class="small muted" style="margin-bottom:10px">Needed = cylinders used per day × average days they keep one. Extra = holding minus needed. A high extra means cylinders are sitting idle at that customer.</div><div id="an-tbl"></div></div>`},
  after(){this.update()},
  update(){const D=S.D;const t=D.today;const months=[];const d0=new Date(+t.slice(0,4),+t.slice(5,7)-1,1);for(let i=11;i>=0;i--){const d=new Date(d0.getFullYear(),d0.getMonth()-i,1);months.push(d.getFullYear()+'-'+pad(d.getMonth()+1))}
    const cnt={};months.forEach(m=>cnt[m]={DC:0,MT:0});
    const cut90=isoFromDay(dayNum(t)-90),cut365=isoFromDay(dayNum(t)-365);const use={},hold={};
    for(const [id,evs] of Object.entries(D.tl)){for(let i=0;i<evs.length;i++){const e=evs[i];if(!e.d)continue;const m=e.d.slice(0,7);if(cnt[m]&&(e.t==='DC'||e.t==='MT'))cnt[m][e.t]++;
      if(e.t==='DC'&&e.ck){if(e.d>=cut90)(use[e.ck]=use[e.ck]||{n:0}).n++;const nx=evs[i+1];if(nx&&nx.t==='MT'&&nx.d&&nx.d>=cut365){const h=hold[e.ck]=hold[e.ck]||{s:0,n:0};h.s+=dayNum(nx.d)-dayNum(e.d);h.n++}}}}
    const mx=Math.max(1,...months.map(m=>Math.max(cnt[m].DC,cnt[m].MT)));const W=760,H=220,pl=40,pb=26,bw=(W-pl-10)/months.length;
    const y=v=>H-pb-(v/mx)*(H-pb-14);const ticks=[0,Math.round(mx/2),mx];
    $('#an-chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px;max-width:100%" role="img" aria-label="Monthly DC and MT counts">
      ${ticks.map(v=>`<line x1="${pl}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join('')}
      ${months.map((m,i)=>{const x=pl+i*bw;const a=cnt[m].DC,b=cnt[m].MT;return `<rect x="${x+bw*0.14}" y="${y(a)}" width="${bw*0.34}" height="${H-pb-y(a)}" fill="var(--info)" rx="2"><title>${m} DC ${a}</title></rect><rect x="${x+bw*0.52}" y="${y(b)}" width="${bw*0.34}" height="${H-pb-y(b)}" fill="var(--ok)" rx="2"><title>${m} MT ${b}</title></rect><text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m.slice(5)-1]}</text>`}).join('')}</svg>`;
    const rows=Object.keys(S.cust).map(ck=>{const h=(D.holding[ck]||[]).length;const u=use[ck]?use[ck].n:0;const hd=hold[ck]&&hold[ck].n?hold[ck].s/hold[ck].n:null;const need=hd!=null?Math.ceil(u/90*hd):null;return {ck,h,u,hd,need,extra:need!=null?h-need:null}}).filter(r=>r.h||r.u).sort((a,b)=>(b.extra??-1e9)-(a.extra??-1e9)||b.h-a.h);
    $('#an-tbl').innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Customer</th><th class="r">Holding</th><th class="r">Used (90 d)</th><th class="r">Per month</th><th class="r">Avg days kept</th><th class="r">Needed</th><th class="r">Extra</th></tr></thead><tbody>${rows.slice(0,150).map(r=>`<tr class="click" data-act="opencust" data-v="${esc(r.ck)}"><td><b>${esc(custName(r.ck))}</b></td><td class="r num">${r.h}</td><td class="r num">${r.u}</td><td class="r num">${(r.u/3).toFixed(1)}</td><td class="r num">${r.hd!=null?Math.round(r.hd):'—'}</td><td class="r num">${r.need??'—'}</td><td class="r">${r.extra==null?'<span class="muted">—</span>':r.extra>=5?`<span class="pill crit num">+${r.extra}</span>`:r.extra>0?`<span class="pill warn num">+${r.extra}</span>`:`<span class="num muted">${r.extra}</span>`}</td></tr>`).join('')}</tbody></table></div>`}
};

/* Reports */
VIEWS.rep={

    const gases=[...new Set(Object.values(S.cyl).map(c=>c.g))].sort();

      ${card('register','Cylinder register (old Excel layout)','Same layout as your Excel sheet: one row per cylinder with DC Date · DC Name · MT Date · MT Name, grouped Dharmapuri, Krishnagiri, N2, CO2, Argon, DURO. Includes old history and app entries.')}
      ${card('stock','Stock status','Every cylinder with gas, branch, status, customer, since date, days and test due.')}
      ${card('holding','Customer holdings','One row per customer: cylinders held, over 30, 90 and 180 days, deposit and rent so far.')}
      ${card('aging','Over 90 days','Cylinders with customers for more than 90 days, with phone numbers for follow-up.')}
      ${card('moves','Movements','All DC, MT and filling in a date range, one row per cylinder.',`<div class="row"><div class="field"><label for="r-from">From</label><input type="date" class="inp" id="r-from" value="${f}"></div><div class="field"><label for="r-to">To</label><input type="date" class="inp" id="r-to" value="${t}"></div></div>`)}
      ${card('stmt','Customer statement','Cylinders a customer holds now and their full DC/MT history.',`<div class="field"><label for="r-cust">Customer</label><select class="inp" id="r-cust">${Object.entries(S.cust).sort((a,b)=>a[1].n.localeCompare(b[1].n)).map(([k,c])=>`<option value="${esc(k)}">${esc(c.n)}</option>`).join('')}</select></div>`)}
      ${card('backup','Full Excel (all details)','Everything in one workbook, in your old Excel layout: O2 Cylinders register, Cylinder - Formula (last DC/MT, days, months), Cylinder Details (purchases), Sold Cylinders, ARG/CO2/N2 lists — plus customers, app entries, invoices, stock and all movements. Keep a copy every month.')}

/* Settings */
const DEFAULT_FU_MSG='Dear {customer}, as per our records {count} cylinder(s) are with you for more than {days} days: {cylinders}. Kindly return the empty cylinders or call us. - {company} {phone}';
const RENT_GASES=['O2','CO2','N2','Argon','DURO'];
VIEWS.settings={
  mount(){const c=S.company;const R=c.rent||{};const B=billCfg();
    return `<div class="page-head"><div><h2>Settings</h2><p>Company details, billing, filling, rent, follow-up, test dates${S.isOwner?' and who can use this desk':''}. Version ${APP_VERSION}.</p></div></div>
    <form class="panel" id="s-co" style="display:flex;flex-direction:column;gap:12px"><h3>Company details</h3>
      <div class="row"><div class="field"><label for="s-name">Company name</label><input class="inp" id="s-name" value="${esc(c.name)}"></div><div class="field"><label for="s-phone">Phone</label><input class="inp" id="s-phone" value="${esc(c.phone)}"></div><div class="field"><label for="s-gst">GSTIN</label><input class="inp mono" id="s-gst" value="${esc(c.gst)}"></div></div>
      <div class="field"><label for="s-addr">Address (printed on DC)</label><textarea class="inp" id="s-addr">${esc(c.addr)}</textarea></div>
      <div class="row">${(c.branches||[]).map(b=>`<div class="field"><label for="s-br-${esc(b)}">Branch ${esc(b)} name</label><input class="inp" id="s-br-${esc(b)}" data-br="${esc(b)}" value="${esc(brName(b))}"></div>`).join('')}</div>
      <div><button class="btn primary" type="submit">${ic('check')}Save details</button></div></form>
    <div class="grid g2">
    <form class="panel" id="s-fill" style="display:flex;flex-direction:column;gap:12px"><h3>Filling</h3>
      <label class="check"><input type="checkbox" id="s-track" ${c.trackFill?'checked':''}> Warn when a DC sends a cylinder that is not marked full</label>
      <div class="field"><label for="s-plants">Filling plants / suppliers (one per line)</label><textarea class="inp" id="s-plants" placeholder="Own plant&#10;HS &amp; AP&#10;ADGS">${esc((c.plants||[]).join('\n'))}</textarea></div>
      <div><button class="btn primary" type="submit">${ic('check')}Save filling</button></div></form>
    <form class="panel" id="s-rent" style="display:flex;flex-direction:column;gap:12px"><h3>Rent</h3>
      <div class="row"><div class="field"><label for="s-free">Free days</label><input class="inp num" type="number" min="0" id="s-free" value="${esc(R.free??30)}"></div>
      ${RENT_GASES.map(g=>`<div class="field"><label for="s-rate-${g}">${g} ₹/day</label><input class="inp num" type="number" min="0" step="0.5" id="s-rate-${g}" data-rate="${g}" value="${esc((R.rates||{})[g]??'')}"></div>`).join('')}</div>
      <div class="small muted">Leave a rate empty for no rent. A customer can have their own rate and free days (edit the customer).</div>
      <div><button class="btn primary" type="submit">${ic('check')}Save rent</button></div></form>
    <form class="panel" id="s-fu" style="display:flex;flex-direction:column;gap:12px"><h3>Follow-up message</h3>
      <div class="field" style="max-width:180px"><label for="s-fudays">Remind after (days)</label><input class="inp num" type="number" min="1" id="s-fudays" value="${esc(c.fuDays||90)}"></div>
      <div class="field"><label for="s-fumsg">Message</label><textarea class="inp" id="s-fumsg" style="min-height:110px">${esc(c.fuMsg||DEFAULT_FU_MSG)}</textarea></div>
      <div class="small muted">Fills in: {customer} {count} {days} {cylinders} {company} {phone}</div>
      <div><button class="btn primary" type="submit">${ic('check')}Save message</button></div></form>
    <form class="panel" id="s-test" style="display:flex;flex-direction:column;gap:12px"><h3>Hydro-test due dates</h3>
      <div class="small muted">One cylinder per line: number, then the month the next test is due (as stamped on the cylinder plus the test interval). Example: <span class="mono">1002 03-2028</span></div>
      <textarea class="inp mono" id="s-tests" style="min-height:140px" placeholder="1002 03-2028&#10;1003 11-2027&#10;C1008 2029-01"></textarea>
      <div><button class="btn primary" type="submit">${ic('check')}Save test dates</button> <span class="small muted" id="s-test-res"></span></div></form>
    <form class="panel" id="s-bill" style="display:flex;flex-direction:column;gap:12px"><h3>Billing</h3><div class="row"><div class="field"><label for="s-bpre">Invoice prefix</label><input class="inp mono" id="s-bpre" value="${esc(B.prefix)}"></div><div class="field"><label for="s-bgst">GST %</label><input class="inp num" type="number" min="0" step="0.5" id="s-bgst" value="${esc(B.gst)}"></div></div>
      <div class="tbl-wrap"><table><thead><tr><th>Gas</th><th>Refill price ₹</th><th>HSN code</th></tr></thead><tbody>${RENT_GASES.map(g=>`<tr><td>${g}</td><td><input class="inp num" type="number" min="0" step="0.01" data-bp="${g}" value="${esc(B.price[g]??'')}" aria-label="${g} refill price"></td><td><input class="inp mono" data-bh="${g}" value="${esc(B.hsn[g]??'')}" aria-label="${g} HSN"></td></tr>`).join('')}</tbody></table></div>
      <div class="small muted">Check GST rates and HSN codes with your accountant. A customer can have their own refill price (edit the customer).</div>
      <div><button class="btn primary" type="submit">${ic('check')}Save billing</button></div></form>
    </div>
    ${S.isOwner?`<div class="panel"><div class="panel-head"><h3>People and roles</h3><span class="muted">Share this page with staff from the Share menu, then set their role here.</span></div><div id="s-people"></div>
      <div class="small muted" style="margin-top:12px"><b>Manager</b>: everything except roles. <b>Staff</b>: new entries, edit own entries on the same day. <b>Viewer</b>: look only. Anyone without a role waits on an access screen.</div></div>`:''}`},
  after(){
    const saveCo=async patch=>{try{await S.db.doc('settings/company').set(Object.assign({},S.company,patch));toast('Saved')}catch(err){toast(dbErr(err))}};
    $('#s-co').addEventListener('submit',e=>{e.preventDefault();const bn=Object.assign({},S.company.branchNames);$$('[data-br]').forEach(i=>bn[i.dataset.br]=i.value.trim()||i.dataset.br);
      saveCo({name:$('#s-name').value.trim(),phone:$('#s-phone').value.trim(),gst:$('#s-gst').value.trim(),addr:$('#s-addr').value.trim(),branchNames:bn})});
    $('#s-fill').addEventListener('submit',e=>{e.preventDefault();saveCo({trackFill:$('#s-track').checked,plants:$('#s-plants').value.split('\n').map(x=>x.trim()).filter(Boolean)})});
    $('#s-rent').addEventListener('submit',e=>{e.preventDefault();const rates={};$$('[data-rate]').forEach(i=>{if(i.value!=='')rates[i.dataset.rate]=+i.value});saveCo({rent:{free:+$('#s-free').value||0,rates}})});
    $('#s-bill').addEventListener('submit',e=>{e.preventDefault();const price={},hsn={};$$('[data-bp]').forEach(i=>{if(i.value!=='')price[i.dataset.bp]=+i.value});$$('[data-bh]').forEach(i=>{if(i.value.trim())hsn[i.dataset.bh]=i.value.trim()});saveCo({bill:{prefix:$('#s-bpre').value.trim()||'INV',gst:$('#s-bgst').value,price,hsn}})});
    $('#s-fu').addEventListener('submit',e=>{e.preventDefault();saveCo({fuDays:+$('#s-fudays').value||90,fuMsg:$('#s-fumsg').value.trim()||DEFAULT_FU_MSG})});
    $('#s-test').addEventListener('submit',async e=>{e.preventDefault();const res=parseTests($('#s-tests').value);
      if(!res.ok.length){$('#s-test-res').textContent=res.bad.length?'Could not read: '+res.bad.slice(0,8).join(', '):'Nothing to save';return}
      const byDoc={};res.ok.forEach(([id,td])=>{const d=S.cylSrc[id]||'m1';(byDoc[d]=byDoc[d]||{})[id]={td}});
      try{for(const [d,list] of Object.entries(byDoc))await S.db.doc('cyl/'+d).update({list});$('#s-tests').value=res.bad.join('\n');
        $('#s-test-res').textContent=`Saved ${res.ok.length}.`+(res.bad.length?` Not saved (left in the box): ${res.bad.length}`:'');toast('Saved '+res.ok.length+' test dates')}catch(err){toast(dbErr(err))}});
    this.update()},
  update(){if(!S.isOwner||!$('#s-people'))return;
    const ids=[...new Set([...Object.keys(S.members),...Object.keys(S.roles)])].filter(i=>i!==S.uid);
    $('#s-people').innerHTML=ids.length?`<div class="tbl-wrap"><table><thead><tr><th>Person</th><th>Last opened</th><th>Role</th><th>Branch</th></tr></thead><tbody>${ids.map(id=>{const r=S.roles[id]||{};const p=S.profiles[id]||{};return `<tr><td><b data-name="${esc(id)}">${esc(p.name||'New person')}</b></td><td class="muted small">${S.members[id]?fmtDT(S.members[id].seen):'—'}</td>
      <td><select class="inp" data-role="${esc(id)}" style="min-width:120px"><option value="">No access</option>${['staff','manager','viewer'].map(x=>`<option value="${x}" ${r.role===x?'selected':''}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></td>
      <td><select class="inp" data-rbr="${esc(id)}">${S.company.branches.map(b=>`<option value="${esc(b)}" ${r.br===b?'selected':''}>${esc(brName(b))}</option>`).join('')}</select></td></tr>`}).join('')}</tbody></table></div>`
      :`<div class="empty"><b>No one else yet</b>When staff open the shared link, they appear here so you can give them a role.</div>`;
    $$('[data-role],[data-rbr]').forEach(sel=>sel.addEventListener('change',async()=>{const id=sel.dataset.role||sel.dataset.rbr;const role=$(`[data-role="${CSS.escape(id)}"]`).value;const br=$(`[data-rbr="${CSS.escape(id)}"]`).value;

function parseTests(txt){const ok=[],bad=[];
  txt.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{const m=line.match(/^(\S+)[\s,;:\t]+(.+)$/);if(!m){bad.push(line);return}
    const id=normCyl(m[1]);const v=m[2].trim();let y,mo;let x;
    if((x=v.match(/^(\d{4})[-\/.](\d{1,2})$/))){y=+x[1];mo=+x[2]}
    else if((x=v.match(/^(\d{1,2})[-\/.](\d{4})$/))){y=+x[2];mo=+x[1]}
    else if((x=v.match(/^(\d{1,2})[-\/.](\d{2})$/))){y=2000+ +x[2];mo=+x[1]}
    if(!S.cyl[id]||!y||mo<1||mo>12||y<2000||y>2100){bad.push(line);return}
    ok.push([id,y+'-'+pad(mo)])});
  return {ok,bad}}

const gasKey=g=>String(g||'').startsWith('CO2')?'CO2':g;
function rentCfg(ck,g){const R=S.company.rent||{};const c=S.cust[ck]||{};
  const free=c.free!=null&&c.free!==''?+c.free:(R.free!=null?+R.free:30);
  const rate=c.rate!=null&&c.rate!==''?+c.rate:(+((R.rates||{})[gasKey(g)])||0);return {free,rate}}
function openRent(ck){let t=0;for(const s of (S.D.holding[ck]||[])){const {free,rate}=rentCfg(ck,s.g);if(rate&&s.days!=null)t+=Math.max(0,s.days-free)*rate}return t}
const rupee=n=>'₹'+Math.round(n).toLocaleString('en-IN');
function rentLines(a,b){const A=dayNum(a),B=dayNum(b)+1;const lines=[];
  for(const id of Object.keys(S.D.tl)){const st=S.D.state[id];for(const t of cylTrips(id)){if(!t.e.d||!t.e.ck)continue;const {free,rate}=rentCfg(t.e.ck,st.g);if(!rate)continue;
    const start=dayNum(t.e.d)+free;const end=t.next&&t.next.d?dayNum(t.next.d):dayNum(todayISO())+1;
    const from=Math.max(start,A),to=Math.min(end,B);const days=to-from;if(days<=0)continue;
    lines.push({ck:t.e.ck,id,g:st.g,dc:t.e.d,back:t.back?t.back.d:'',from:isoFromDay(from),to:isoFromDay(to-1),days,rate,amt:days*rate})}}
  return lines}

  r.cy.forEach((id,i)=>{if(y>180){p.addPage();y=16}const st=S.cyl[id]||{};p.text(String(i+1),12,y+5);p.setFont('courier','bold');p.text(id,26,y+5);p.setFont('helvetica','normal');p.text(st.g||'',76,y+5);y+=6.5;p.setDrawColor(210);p.line(10,y,W-10,y)});
  y+=6;p.setFont('helvetica','bold');p.text('Total full cylinders: '+r.cy.length,10,y);y+=8;
  p.setFont('helvetica','normal');p.text('Empty cylinders received: ________________________________',10,y);y+=7;
  if(r.rm){p.text('Remarks: '+r.rm,10,y);y+=7}
  y=Math.max(y+14,186);p.line(10,y,58,y);p.line(W-58,y,W-10,y);p.setFontSize(8.5);p.text("Receiver's signature",10,y+4);p.text('For '+(co.name||''),W-10,y+4,{align:'right'});
  await saveFile(`DC ${r.dc||''} ${custName(r.ck)} ${r.d}.pdf`.replace(/\s+/g,' '),p.output('arraybuffer'));
}

/* ---------------- boot ---------------- */
async function boot(){
  ['app','drawer-root','toast-root'].forEach(id=>trObs.observe(document.getElementById(id),{childList:true,subtree:true}));
  if(LANG==='ta')document.documentElement.lang='ta';
  refresh();
  const C=window.FBC;
  if(!C||!C.use){S.db=null;Object.keys(S.loaded).forEach(k=>S.loaded[k]=true);refresh();return}
  const [db,user,dl]=await Promise.all([C.use('db'),C.use('user'),C.use('downloads')]);
  S.db=db;S.user=user;S.dl=dl;
  if(!db){Object.keys(S.loaded).forEach(k=>S.loaded[k]=true);refresh();return}
  if(user){try{S.me=await user.me();S.uid=S.me.id;S.isOwner=!!S.me.isOwner}catch(e){}}
  if(S.isOwner)S.readOnly=false;
  bootData();registerMember();watchMembers();
  paintShell();
}
if(window.__TEST)window.__T={S,rentLines,parseTests,fuMessage,openRent,runReport,noCheck,gaps,words,setLang};
boot();
