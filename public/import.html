<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cylinder Desk · Import</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#F2F5F3;--surface:#fff;--line:#D3DCD8;--ink:#13201C;--muted:#5A6A65;--accent:#0E6B5A;--on-accent:#fff;--ok:#2C7A3A;--crit:#B3261E}
@media (prefers-color-scheme:dark){:root{--bg:#0E1412;--surface:#151D1A;--line:#2A3631;--ink:#E3EBE7;--muted:#93A39D;--accent:#4CB89D;--on-accent:#08201A;--ok:#6CC27A;--crit:#F2766B}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
.panel{max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
h1{font-size:22px;margin:0 0 4px}
.muted{color:var(--muted)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:8px;padding:10px 16px;font:600 15px inherit;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
input[type=file]{display:block;margin:10px 0 16px;max-width:100%}
#log{font:13px ui-monospace,Consolas,monospace;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:16px;min-height:60px;max-height:320px;overflow:auto}
.ok{color:var(--ok)}.err{color:var(--crit)}
</style>
</head>
<body>
<div class="panel">
  <h1>Import old data</h1>
  <p class="muted">One time only. Copies cylinders, customers, old Excel history, purchases, sales and entries from the old Cylinder Desk into Firebase.<br>
  ஒரே ஒருமுறை மட்டும். பழைய Cylinder Desk தரவை Firebase-க்கு மாற்றுகிறது.</p>
  <div id="who" class="muted">Signing in…</div>
  <div id="step" hidden>
    <label for="file"><b>Choose <code>data-export.json</code></b></label>
    <input type="file" id="file" accept=".json,application/json">
    <button class="btn" id="go" disabled>Import</button>
    <button class="btn ghost" onclick="location.href='./'">Open app</button>
  </div>
  <div id="log"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="fb.js"></script>
<script>
(async()=>{
const $=s=>document.querySelector(s);
const log=(t,c)=>{const d=document.createElement('div');if(c)d.className=c;d.textContent=t;$('#log').appendChild(d);$('#log').scrollTop=1e9};
const OLD_OWNER_ID='u_JbbgoIyBniYFYF4vkHsLmg';
const {fs,enc,userReady}=FBC._raw;
const me=await userReady;
$('#who').innerHTML='Signed in as <b></b>';$('#who b').textContent=me.email;
if(!me.isOwner){log('Only the owner account can import data.','err');return}
$('#step').hidden=false;
let bundle=null;
$('#file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    /* Entries made in the old app carry the old account id; give them to this owner account. */
    const text=(await f.text()).split(OLD_OWNER_ID).join(me.id);
    bundle=JSON.parse(text);
    const n=Object.values(bundle).reduce((a,c)=>a+Object.keys(c).length,0);
    log('File OK: '+n+' records in '+Object.keys(bundle).join(', '));
    $('#go').disabled=false;
  }catch(err){bundle=null;$('#go').disabled=true;log('This is not the right file ('+err.message+').','err')}
};
$('#go').onclick=async()=>{
  if(!bundle)return;
  const meta=await fs.doc('hist/meta').get();
  if(meta.exists&&!confirm('Data was already imported once. Import again and overwrite it with the file?'))return;
  $('#go').disabled=true;$('#file').disabled=true;
  let done=0,fail=0;
  for(const [col,docs] of Object.entries(bundle)){
    for(const [id,data] of Object.entries(docs)){
      try{await fs.doc(col+'/'+id).set(enc(data));done++;log('✓ '+col+'/'+id)}
      catch(err){fail++;log('✗ '+col+'/'+id+' — '+(err.code||err.message),'err')}
    }
  }
  if(fail)log(fail+' failed. Check the errors above and press Import again.','err');
  else log('Done. '+done+' records imported. You can open the app now.','ok');
  $('#go').disabled=!fail;$('#file').disabled=false;
};
})();
</script>
</body>
</html>
